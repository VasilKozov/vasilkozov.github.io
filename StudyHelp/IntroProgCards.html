":"how","q":{"bg":"Защо getline след >> понякога чете празен ред?","en":"Why does getline after >> sometimes read an empty line?"},"a":{"bg":">> оставя разделителя за нов ред във входа. Ако искаш следващия ред, пропусни остатъка от текущия преди getline.","en":">> leaves the newline in the input. To read the next line, discard the rest of the current line before getline."},"code":"int n = 0;\nchar line[81];\nstd::cin >> n;\nstd::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');\nstd::cin.getline(line, sizeof line);","front":"","source":"L7_Strings.pdf · 2","headers":"iostream,limits","scope":"block"},{"id":"strings-06","topic":"strings","kind":"term","q":{"bg":"strlen(s)","en":"strlen(s)"},"a":{"bg":"Броят char елементи преди \\0, без самия край. Нужен е валиден завършен низ. В UTF-8 това е брой байтове, не непременно видими букви.","en":"The count of char elements before \\0, excluding the terminator. Requires a valid terminated string. In UTF-8 it counts bytes, not necessarily displayed letters."},"code":"char s[] = \"hello\";\nstd::size_t length = std::strlen(s);","front":"","source":"L7_Strings.pdf · 7","headers":"cstring","scope":"block"},{"id":"strings-07","topic":"strings","kind":"term","q":{"bg":"strcpy(destination, source)","en":"strcpy(destination, source)"},"a":{"bg":"Копира C низ заедно с \\0. Получателят трябва да има достатъчен капацитет, а областите да не се застъпват.","en":"Copies a C string including \\0. The destination needs sufficient capacity and the memory regions must not overlap."},"code":"char destination[20];\nstd::strcpy(destination, \"hello\");","front":"","source":"L7_Strings.pdf · 5–6","headers":"cstring","scope":"block"},{"id":"strings-08","topic":"strings","kind":"term","q":{"bg":"strncpy и крайният \\0","en":"strncpy and the final \\0"},"a":{"bg":"Копира до n символа; не гарантира краен \\0, ако източникът е поне n символа. При извличане на префикс го добави явно.","en":"Copies up to n characters; it does not guarantee a terminator if the source is at least n characters long. Add it explicitly when extracting a prefix."},"code":"char prefix[4];\nstd::strncpy(prefix, \"abcdef\", 3);\nprefix[3] = '\\0';","front":"","source":"L7_Strings.pdf · 6","headers":"cstring","scope":"block"},{"id":"strings-09","topic":"strings","kind":"term","q":{"bg":"strcat(destination, source)","en":"strcat(destination, source)"},"a":{"bg":"Добавя source в края на destination. И двата низа трябва да са завършени; капацитетът трябва да побира общата дължина + 1.","en":"Appends source to destination. Both must be terminated strings, and capacity must fit the total length + 1."},"code":"char text[20] = \"Hello\";\nstd::strcat(text, \" world\");","front":"","source":"L7_Strings.pdf · 7","headers":"cstring","scope":"block"},{"id":"strings-10","topic":"strings","kind":"term","q":{"bg":"strcmp(a, b)","en":"strcmp(a, b)"},"a":{"bg":"0 при равни низове; отрицателно при a преди b; положително при a след b. Гледай знака, не очаквай точно -1 или 1.","en":"0 for equal strings; negative when a precedes b; positive when a follows b. Check the sign, not specifically -1 or 1."},"code":"bool same = (std::strcmp(\"cat\", \"cat\") == 0);","front":"","source":"L7_Strings.pdf · 7–8","headers":"cstring","scope":"block"},{"id":"strings-11","topic":"strings","kind":"read","q":{"bg":"Сравнява ли == съдържанието на C низове?","en":"Does == compare C-string contents?"},"a":{"bg":"Не при указатели към char: сравнява адресите. За съдържание използвай strcmp.","en":"Not for char pointers: it compares addresses. Use strcmp for contents."},"code":"","front":"","source":"L7_Strings.pdf · 5, 7","headers":"","scope":"block"},{"id":"strings-12","topic":"strings","kind":"how","q":{"bg":"Как да преброим срещанията на символ?","en":"How do we count occurrences of a character?"},"a":{"bg":"Обхождай до \\0 и увеличавай брояча при съвпадение. Примерът обработва еднобайтови латински символи.","en":"Scan until \\0 and increment a counter on a match. This example processes single-byte Latin characters."},"code":"char s[] = \"banana\";\nchar target = 'a';\nint count = 0;\nfor (int i = 0; s[i] != '\\0'; ++i)\n    if (s[i] == target) ++count;","front":"","source":"12_export.pdf · пример 3","headers":"","scope":"block"},{"id":"strings-13","topic":"strings","kind":"how","q":{"bg":"Как да проверим низ за палиндром?","en":"How do we test a string for being a palindrome?"},"a":{"bg":"Сравнявай симетрични позиции от двата края към средата. Тук сравнението е по char, без премахване на интервали или промяна на регистъра.","en":"Compare symmetric positions from both ends toward the middle. This compares char elements without removing spaces or changing case."},"code":"char s[] = \"level\";\nint left = 0, right = static_cast<int>(std::strlen(s)) - 1;\nbool palindrome = true;\nwhile (left < right) {\n    if (s[left] != s[right]) { palindrome = false; break; }\n    ++left; --right;\n}","front":"","source":"12_export.pdf · пример 4","headers":"cstring","scope":"block"},{"id":"strings-14","topic":"strings","kind":"term","q":{"bg":"atoi / atol / atof","en":"atoi / atol / atof"},"a":{"bg":"Преобразуват начален числов текст съответно в int, long и double. atof не връща float. Не предоставят надеждно разграничаване на грешен вход от стойност 0.","en":"Convert initial numeric text to int, long and double respectively. atof does not return float. They do not reliably distinguish invalid input from the value 0."},"code":"int count = std::atoi(\"123\");\ndouble price = std::atof(\"2.5\");","front":"","source":"L7_Strings.pdf · 8","headers":"cstdlib","scope":"block"},{"id":"strings-15","topic":"strings","kind":"how","q":{"bg":"Как да превърнем число в C низ преносимо?","en":"How do we convert a number to a C string portably?"},"a":{"bg":"Вместо нестандартната itoa може да се използва snprintf с капацитет на буфера. Провери резултата при възможно съкращаване.","en":"Instead of nonstandard itoa, use snprintf with the buffer capacity. Check its result if truncation is possible."},"code":"char text[20];\nint written = std::snprintf(text, sizeof text, \"%d\", 123);","front":"","source":"L7_Strings.pdf · 8–9","headers":"cstdio","scope":"block"},{"id":"strings-16","topic":"strings","kind":"term","q":{"bg":"Масив от низове","en":"Array of C strings"},"a":{"bg":"Двумерен char масив. Тук има място за 3 низа, всеки до 20 char елемента плюс \\0.","en":"A two-dimensional char array. Here it holds 3 strings, each with up to 20 char elements plus \\0."},"code":"char names[3][21] = {\"Ana\", \"Boris\", \"Mira\"};","front":"","source":"L7_Strings.pdf · 9–10","headers":"","scope":"block"},{"id":"strings-17","topic":"strings","kind":"how","q":{"bg":"Как да намерим най-големия низ по strcmp?","en":"How do we find the greatest string using strcmp?"},"a":{"bg":"Запомни индекса; сравнявай съдържание чрез strcmp. Лексикографският ред не е същото като ред по дължина.","en":"Store the index; compare contents using strcmp. Lexicographic order is not the same as length order."},"code":"char names[3][21] = {\"Ana\", \"Boris\", \"Mira\"};\nint pos = 0;\nfor (int i = 1; i < 3; ++i)\n    if (std::strcmp(names[i], names[pos]) > 0) pos = i;","front":"","source":"L7_Strings.pdf · 10","headers":"cstring","scope":"block"},{"id":"strings-18","topic":"strings","kind":"how","q":{"bg":"Как да преброим думите, разделени с интервали?","en":"How do we count space-separated words?"},"a":{"bg":"Брой началата на думи: текущият символ не е интервал, а предишният е интервал или няма предишен. Тук разделител е само обикновен интервал.","en":"Count word starts: the current character is not a space and the previous character is a space or absent. Here only an ordinary space is a delimiter."},"code":"char s[] = \"  one two  three \";\nint words = 0;\nfor (int i = 0; s[i] != '\\0'; ++i)\n    if (s[i] != ' ' && (i == 0 || s[i - 1] == ' '))\n        ++words;","front":"","source":"12_export.pdf · задачи 4–5","headers":"","scope":"block"},{"id":"strings-19","topic":"strings","kind":"term","q":{"bg":"Защо ЕГН се пази като низ?","en":"Why store a national identification number as a string?"},"a":{"bg":"За да се запазят водещите нули и да се достъпват цифрите по позиции. Десет цифри изискват char egn[11]. Това не прави автоматична проверка за валидно ЕГН.","en":"To preserve leading zeros and access digits by position. Ten digits require char egn[11]. This does not automatically validate the identifier."},"code":"char egn[11] = \"0000000000\";","front":"","source":"12_export.pdf · пример 2","headers":"","scope":"block"},{"id":"strings-20","topic":"strings","kind":"how","q":{"bg":"Как да получим числова цифра от '7'?","en":"How do we turn '7' into the number 7?"},"a":{"bg":"Извади '0', след като провериш, че символът е между '0' и '9'. Цифровите кодове са последователни.","en":"Subtract '0' after checking that the character lies between '0' and '9'. Digit codes are contiguous."},"code":"char ch = '7';\nint digit = ch - '0';","front":"","source":"12_export.pdf · пример 2","headers":"","scope":"block"},{"id":"recursion-01","topic":"recursion","kind":"term","q":{"bg":"Рекурсия","en":"Recursion"},"a":{"bg":"Функция се извиква пряко или чрез други функции. Задачата се свежда до по-малък случай, докато се достигне граничен случай.","en":"A function calls itself directly or through other functions. The problem reduces to a smaller case until a base case is reached."},"code":"","front":"","source":"L8_Rekursia.pdf · 1","headers":"","scope":"block"},{"id":"recursion-02","topic":"recursion","kind":"term","q":{"bg":"Граничен случай","en":"Base case"},"a":{"bg":"Случай с директен отговор без ново рекурсивно извикване. Всяка допустима последователност от извиквания трябва да стига до него.","en":"A case with a direct answer and no recursive call. Every valid chain of calls must reach it."},"code":"","front":"","source":"L8_Rekursia.pdf · 1–5","headers":"","scope":"block"},{"id":"recursion-03","topic":"recursion","kind":"read","q":{"bg":"Защо параметърът трябва да се променя?","en":"Why must the recursion make progress?"},"a":{"bg":"Всяка стъпка трябва да приближава граничния случай. Само наличие на if не спира рекурсията, ако извикването повтаря същия нерешен случай.","en":"Each step must approach the base case. Merely having an if does not stop recursion if calls repeat the same unresolved case."},"code":"","front":"","source":"L8_Rekursia.pdf · 5","headers":"","scope":"block"},{"id":"recursion-04","topic":"recursion","kind":"how","q":{"bg":"Рекурсивен факториел","en":"Recursive factorial"},"a":{"bg":"0! = 1; за n > 0: n! = n·(n−1)!. Тук използвай n от 0 до 20, за да се побира резултатът в unsigned long long.","en":"0! = 1; for n > 0: n! = n·(n−1)!. Here use n from 0 to 20 so the result fits in unsigned long long."},"code":"unsigned long long factorial(unsigned n) {\n    if (n == 0) return 1;\n    return n * factorial(n - 1);\n}","front":"","source":"L8_Rekursia.pdf · 3–5","headers":"","scope":"global"},{"id":"recursion-05","topic":"recursion","kind":"read","q":{"bg":"Каква е веригата за factorial(3)?","en":"What is the call chain for factorial(3)?"},"a":{"bg":"3 × factorial(2) → 3 × 2 × factorial(1) → 3 × 2 × 1 × factorial(0) → 6. Връщанията довършват извикванията в обратен ред.","en":"3 × factorial(2) → 3 × 2 × factorial(1) → 3 × 2 × 1 × factorial(0) → 6. Returns complete the calls in reverse order."},"code":"","front":"","source":"L8_Rekursia.pdf · 3–5","headers":"","scope":"block"},{"id":"recursion-06","topic":"recursion","kind":"how","q":{"bg":"Как да сумираме цифри рекурсивно?","en":"How do we sum digits recursively?"},"a":{"bg":"Последната цифра е n % 10; останалите са n / 10. Входът е неотрицателен.","en":"The last digit is n % 10; the remaining digits are n / 10. The input is nonnegative."},"code":"int digitSum(unsigned n) {\n    if (n < 10) return n;\n    return n % 10 + digitSum(n / 10);\n}","front":"","source":"L8_Rekursia.pdf · 5–6","headers":"","scope":"global"},{"id":"recursion-07","topic":"recursion","kind":"how","q":{"bg":"Как да намерим НОД рекурсивно?","en":"How do we find the GCD recursively?"},"a":{"bg":"Граничен случай: b = 0. Иначе продължи с (b, a % b). Входовете са неотрицателни и не са едновременно 0.","en":"Base case: b = 0. Otherwise continue with (b, a % b). Inputs are nonnegative and not both zero."},"code":"int gcd(int a, int b) {\n    if (b == 0) return a;\n    return gcd(b, a % b);\n}","front":"","source":"15.pdf · задача 3","headers":"","scope":"global"},{"id":"recursion-08","topic":"recursion","kind":"how","q":{"bg":"Как да сумираме масив рекурсивно?","en":"How do we sum an array recursively?"},"a":{"bg":"При n = 0 сумата е 0. Иначе събери последния елемент със сумата на първите n−1. n трябва да е валиден брой елементи.","en":"For n = 0, the sum is 0. Otherwise add the last element to the sum of the first n−1. n must be a valid element count."},"code":"int sumArray(const int a[], int n) {\n    if (n == 0) return 0;\n    return a[n - 1] + sumArray(a, n - 1);\n}","front":"","source":"L8_Rekursia.pdf · 7","headers":"","scope":"global"},{"id":"recursion-09","topic":"recursion","kind":"how","q":{"bg":"Как да обърнем низ рекурсивно?","en":"How do we reverse a string recursively?"},"a":{"bg":"Размени двата крайни char елемента и продължи навътре. Спри при дължина 0 или 1. Тук низът е еднобайтов текст.","en":"Swap the outermost char elements and continue inward. Stop at length 0 or 1. This example uses single-byte text."},"code":"void reverse(char* s, int length) {\n    if (length <= 1) return;\n    char temp = s[0];\n    s[0] = s[length - 1];\n    s[length - 1] = temp;\n    reverse(s + 1, length - 2);\n}","front":"","source":"15.pdf · пример 1","headers":"","scope":"global"},{"id":"recursion-10","topic":"recursion","kind":"how","q":{"bg":"Как да преброим интервали рекурсивно?","en":"How do we count spaces recursively?"},"a":{"bg":"Спри при \\0. Прибави 1, ако текущият символ е интервал, и обработи остатъка.","en":"Stop at \\0. Add 1 if the current character is a space, then process the rest."},"code":"int countSpaces(const char* s) {\n    if (*s == '\\0') return 0;\n    return (*s == ' ' ? 1 : 0) + countSpaces(s + 1);\n}","front":"","source":"15.pdf · пример 2","headers":"","scope":"global"},{"id":"recursion-11","topic":"recursion","kind":"how","q":{"bg":"Фибоначи: гранични случаи и формула","en":"Fibonacci: base cases and recurrence"},"a":{"bg":"F(0)=0, F(1)=1, F(n)=F(n−1)+F(n−2). Този прост рекурсивен вариант повтаря много изчисления; използвай само малко n.","en":"F(0)=0, F(1)=1, F(n)=F(n−1)+F(n−2). This simple recursive version repeats many calculations; use only small n."},"code":"int fibonacci(int n) {\n    if (n < 2) return n;\n    return fibonacci(n - 1) + fibonacci(n - 2);\n}","front":"","source":"L8_Rekursia.pdf · 13","headers":"","scope":"global"},{"id":"recursion-12","topic":"recursion","kind":"term","q":{"bg":"Какво пази стекът при рекурсия?","en":"What does the call stack store in recursion?"},"a":{"bg":"Всяко активно извикване има собствени параметри и автоматични локални променливи. Много дълбока рекурсия може да изчерпи стека.","en":"Each active call has its own parameters and automatic local variables. Very deep recursion can exhaust the stack."},"code":"","front":"","source":"L8_Rekursia.pdf · 3–5","headers":"","scope":"block"},{"id":"structs-01","topic":"structs","kind":"term","q":{"bg":"struct","en":"struct"},"a":{"bg":"Съставен тип, който събира именувани полета, включително от различни типове. Подходящ е за описание на един обект.","en":"A compound type that groups named fields, which may have different types. It is useful for describing one entity."},"code":"struct Product {\n    char name[31];\n    double price;\n    int quantity;\n};","front":"","source":"9_Struct.pdf · 1–2","headers":"","scope":"global"},{"id":"structs-02","topic":"structs","kind":"read","q":{"bg":"Защо има ; след struct?","en":"Why is there a ; after a struct?"},"a":{"bg":"Завършва декларацията на типа. Затварящата } завършва списъка от членове, но не заменя ;.","en":"It ends the type declaration. The closing } ends the member list but does not replace the semicolon."},"code":"struct Point { double x, y; };","front":"","source":"9_Struct.pdf · 2","headers":"","scope":"global"},{"id":"structs-03","topic":"structs","kind":"how","q":{"bg":"Как се инициализира структура?","en":"How do we initialize a structure?"},"a":{"bg":"За тази проста структура стойностите в { } са в реда на полетата.","en":"For this simple structure, values in { } follow the field order."},"code":"struct Point { double x, y; };\nPoint p = {2.0, 3.0};","front":"","source":"9_Struct.pdf · 3","headers":"","scope":"block"},{"id":"structs-04","topic":"structs","kind":"term","q":{"bg":"Операторът .","en":"The . operator"},"a":{"bg":"Достъп до член на обект от структура.","en":"Accesses a member of a structure object."},"code":"struct Point { double x, y; };\nPoint p = {2, 3};\np.x = 7;","front":"","source":"9_Struct.pdf · 3–4","headers":"","scope":"block"},{"id":"structs-05","topic":"structs","kind":"term","q":{"bg":"Операторът ->","en":"The -> operator"},"a":{"bg":"Достъп до член през указател към валиден обект. p->x означава (*p).x.","en":"Accesses a member through a pointer to a valid object. p->x means (*p).x."},"code":"struct Point { double x, y; };\nPoint point = {2, 3};\nPoint* p = &point;\np->x = 7;","front":"","source":"16_export.pdf · 13.4","headers":"","scope":"block"},{"id":"structs-06","topic":"structs","kind":"term","q":{"bg":"Вложена структура","en":"Nested structure"},"a":{"bg":"Поле може само да е структура. Последователни точки достигат до вътрешното поле.","en":"A field can itself be a structure. Chained dots reach the inner field."},"code":"struct Date { int day, month, year; };\nstruct Student { Date birth; int course; };\nStudent s = {{23, 4, 2006}, 1};\nint year = s.birth.year;","front":"","source":"9_Struct.pdf · 2–3","headers":"","scope":"block"},{"id":"structs-07","topic":"structs","kind":"term","q":{"bg":"Присвояване на структури","en":"Structure assignment"},"a":{"bg":"За показаните прости структури b = a копира полетата, включително вградените масиви. Това е различно от директното присвояване на два самостоятелни масива.","en":"For these simple structures, b = a copies the fields, including built-in array members. This differs from directly assigning two standalone arrays."},"code":"struct Point { double x, y; };\nPoint a = {2, 3}, b = {};\nb = a;","front":"","source":"9_Struct.pdf · 4","headers":"","scope":"block"},{"id":"structs-08","topic":"structs","kind":"how","q":{"bg":"Как да променим структура във функция?","en":"How do we change a structure in a function?"},"a":{"bg":"Подай референция или указател към оригинала. Предаване по стойност променя само копие.","en":"Pass a reference or a pointer to the original. Passing by value changes only a copy."},"code":"struct Point { double x, y; };\nvoid moveX(Point& p, double dx) {\n    p.x += dx;\n}","front":"","source":"16_export.pdf · примери 1–2","headers":"","scope":"global"},{"id":"structs-09","topic":"structs","kind":"how","q":{"bg":"Как да пазим група обекти от един вид?","en":"How do we store a group of similar entities?"},"a":{"bg":"Използвай масив от структури. Първо избери елемента, после негово поле.","en":"Use an array of structures. Select an element first, then a field."},"code":"struct Product { double price; int quantity; };\nProduct items[3] = {{2.5, 4}, {3.0, 2}, {1.0, 5}};\ndouble firstPrice = items[0].price;","front":"","source":"9_Struct.pdf · 4–5","headers":"","scope":"block"},{"id":"structs-10","topic":"structs","kind":"how","q":{"bg":"Как да изчислим обща стойност на стоки?","en":"How do we calculate the total value of stock?"},"a":{"bg":"За всяка стока умножи единичната цена по количеството и добави към общата сума.","en":"For each product, multiply unit price by quantity and add it to the total."},"code":"struct Product { double price; int quantity; };\nProduct items[] = {{2.5, 4}, {3.0, 2}};\ndouble total = 0;\nfor (int i = 0; i < 2; ++i)\n    total += items[i].price * items[i].quantity;","front":"","source":"16_export.pdf · пример 1","headers":"","scope":"block"},{"id":"structs-11","topic":"structs","kind":"term","q":{"bg":"union срещу struct","en":"union versus struct"},"a":{"bg":"При union членовете споделят памет; обикновено използваш само активния член. При struct полетата съществуват едновременно. Размерът може да включва подравняване.","en":"Union members share storage; normally only the active member is used. Structure fields exist simultaneously. Size may include alignment padding."},"code":"union Value { int number; double real; };\nValue v;\nv.number = 7;","front":"","source":"9_Struct.pdf · 12–14","headers":"","scope":"block"},{"id":"structs-12","topic":"structs","kind":"term","q":{"bg":"Защо union често има enum етикет?","en":"Why is a union often paired with an enum tag?"},"a":{"bg":"За да запомниш кой член е активен. При четене избирай члена според етикета.","en":"To record which member is active. Choose the member to read according to the tag."},"code":"enum Kind { integerValue, realValue };\nstruct TaggedValue {\n    Kind kind;\n    union { int number; double real; };\n};\nTaggedValue value = {};\nvalue.kind = integerValue;\nvalue.number = 7;","front":"","source":"9_Struct.pdf · 14–15","headers":"","scope":"block"},{"id":"files-01","topic":"files","kind":"term","q":{"bg":"Файл","en":"File"},"a":{"bg":"Именуван набор от данни във външната памет. Позволява данните да се използват и след приключване на програмата.","en":"A named collection of data in external storage. It allows data to be reused after the program ends."},"code":"","front":"","source":"10_Files_n.pdf · 1","headers":"","scope":"block"},{"id":"files-02","topic":"files","kind":"term","q":{"bg":"Текстов и двоичен файл","en":"Text and binary file"},"a":{"bg":"Текстовият пази представяне на символи и числа като текст. Двоичният пази байтове; за интерпретацията им е нужен известен формат.","en":"A text file stores textual representations of characters and numbers. A binary file stores bytes; interpreting them requires a known format."},"code":"","front":"","source":"10_Files_n.pdf · 1","headers":"","scope":"block"},{"id":"files-03","topic":"files","kind":"term","q":{"bg":"FILE*","en":"FILE*"},"a":{"bg":"Указател към обект за управление на отворен файл в C библиотеката. В C++ може да използваш <cstdio> и std::FILE.","en":"A pointer to a C-library object managing an open file. In C++, use <cstdio> and std::FILE."},"code":"std::FILE* file = nullptr;","front":"","source":"10_Files_n.pdf · 1","headers":"cstdio","scope":"block"},{"id":"files-04","topic":"files","kind":"how","q":{"bg":"fopen: как се проверява успех?","en":"fopen: how do we check success?"},"a":{"bg":"Връща указател при успех и nullptr при неуспех. Работи с файла и го затвори само ако е отворен успешно.","en":"Returns a pointer on success and nullptr on failure. Use and close the file only if opening succeeded."},"code":"std::FILE* file = std::fopen(\"data.txt\", \"r\");\nif (file != nullptr) {\n    std::fclose(file);\n}","front":"","source":"10_Files_n.pdf · 1–3","headers":"cstdio","scope":"block"},{"id":"files-05","topic":"files","kind":"term","q":{"bg":"Режими \"r\", \"w\", \"a\"","en":"Modes \"r\", \"w\", \"a\""},"a":{"bg":"r — четене на съществуващ файл; w — запис, създава или изтрива старото съдържание; a — добавяне в края, създава при липса.","en":"r reads an existing file; w writes, creating or truncating the file; a appends at the end, creating the file if absent."},"code":"","front":"","source":"10_Files_n.pdf · 2","headers":"","scope":"block"},{"id":"files-06","topic":"files","kind":"term","q":{"bg":"Какво означават + и b в режима?","en":"What do + and b mean in a mode?"},"a":{"bg":"+ позволява четене и запис. b избира двоичен режим. Например r+b отваря съществуващ двоичен файл за четене и запис.","en":"+ enables reading and writing. b selects binary mode. For example, r+b opens an existing binary file for reading and writing."},"code":"","front":"","source":"10_Files_n.pdf · 2–3","headers":"","scope":"block"},{"id":"files-07","topic":"files","kind":"term","q":{"bg":"fclose(file)","en":"fclose(file)"},"a":{"bg":"Затваря отворения поток и освобождава ресурсите му. Не го използвай след затваряне. fclose с нулев указател е невалидно.","en":"Closes an open stream and releases its resources. Do not use the stream afterwards. Passing a null pointer to fclose is invalid."},"code":"","front":"","source":"10_Files_n.pdf · 3","headers":"","scope":"block"},{"id":"files-08","topic":"files","kind":"how","q":{"bg":"Как да запишем цяло число двоично?","en":"How do we write an integer in binary?"},"a":{"bg":"fwrite получава адрес, размер на един елемент и брой елементи. Връща броя успешно записани елементи; провери го.","en":"fwrite receives an address, one element’s size and an element count. It returns the count successfully written; check it."},"code":"int x = 42;\nstd::FILE* f = std::fopen(\"number.bin\", \"wb\");\nif (f) {\n    std::size_t written = std::fwrite(&x, sizeof x, 1, f);\n    if (written != 1) std::perror(\"write\");\n    std::fclose(f);\n}","front":"","source":"10_Files_n.pdf · 4","headers":"cstdio","scope":"block"},{"id":"files-09","topic":"files","kind":"how","q":{"bg":"Как да прочетем всички двоични числа?","en":"How do we read all binary integers?"},"a":{"bg":"Условието на цикъла е успешното четене. Не използвай стойност, ако fread не е прочело цял елемент.","en":"The loop condition is a successful read. Do not use a value unless fread read one complete element."},"code":"std::FILE* f = std::fopen(\"number.bin\", \"rb\");\nif (f) {\n    int x;\n    while (std::fread(&x, sizeof x, 1, f) == 1)\n        std::cout << x << '\\n';\n    std::fclose(f);\n}","front":"","source":"10_Files_n.pdf · 4, 7–9","headers":"cstdio,iostream","scope":"block"},{"id":"files-10","topic":"files","kind":"read","q":{"bg":"Защо !feof(f) не е достатъчно условие за четене?","en":"Why isn’t !feof(f) a sufficient reading condition?"},"a":{"bg":"feof проверява вече зададен индикатор за край. Той се задава след опит за четене отвъд края; сам не предсказва следващия успешен прочит. Проверявай fread/fscanf/fgets.","en":"feof checks an already-set end-of-file indicator. It is set after an attempt to read beyond the end; it does not predict a successful next read. Test fread/fscanf/fgets."},"code":"","front":"","source":"10_Files_n.pdf · 6","headers":"","scope":"block"},{"id":"files-11","topic":"files","kind":"how","q":{"bg":"Как да прочетем цели числа от текстов файл?","en":"How do we read integers from a text file?"},"a":{"bg":"fscanf връща броя успешно преобразувани и присвоени полета. %d изисква адрес на int, затова подай &x.","en":"fscanf returns the number of successfully converted and assigned fields. %d requires a pointer to int, so pass &x."},"code":"std::FILE* f = std::fopen(\"data.txt\", \"r\");\nif (f) {\n    int x;\n    while (std::fscanf(f, \"%d\", &x) == 1)\n        std::cout << x << '\\n';\n    std::fclose(f);\n}","front":"","source":"10_Files_n.pdf · 20–23","headers":"cstdio,iostream","scope":"block"},{"id":"files-12","topic":"files","kind":"how","q":{"bg":"Как да запишем число като текст?","en":"How do we write a number as text?"},"a":{"bg":"fprintf форматира изхода. При запис подаваш стойността x, а не адреса &x. Отрицателен резултат означава грешка.","en":"fprintf formats output. Pass the value x, not &x, for writing. A negative return value signals an error."},"code":"std::FILE* f = std::fopen(\"data.txt\", \"w\");\nif (f) {\n    int x = 42;\n    std::fprintf(f, \"%d\\n\", x);\n    std::fclose(f);\n}","front":"","source":"10_Files_n.pdf · 20","headers":"cstdio","scope":"block"},{"id":"files-13","topic":"files","kind":"how","q":{"bg":"Как да четем редове от текстов файл?","en":"How do we read lines from a text file?"},"a":{"bg":"fgets чете до капацитет−1, добавя \\0 и може да запази новия ред в буфера. Дълъг ред може да се прочете на няколко части.","en":"fgets reads up to capacity−1, adds \\0 and may retain the newline. A long line may be read in several pieces."},"code":"std::FILE* f = std::fopen(\"data.txt\", \"r\");\nif (f) {\n    char line[81];\n    while (std::fgets(line, sizeof line, f))\n        std::cout << line;\n    std::fclose(f);\n}","front":"","source":"10_Files_n.pdf · 20","headers":"cstdio,iostream","scope":"block"},{"id":"files-14","topic":"files","kind":"term","q":{"bg":"fputs","en":"fputs"},"a":{"bg":"Записва C низ във файл, без крайния \\0. Не добавя нов ред автоматично.","en":"Writes a C string to a file without its terminating \\0. It does not automatically append a newline."},"code":"std::FILE* f = std::fopen(\"data.txt\", \"w\");\nif (f) {\n    std::fputs(\"Hello\\n\", f);\n    std::fclose(f);\n}","front":"","source":"10_Files_n.pdf · 20","headers":"cstdio","scope":"block"},{"id":"files-15","topic":"files","kind":"term","q":{"bg":"ftell и fseek","en":"ftell and fseek"},"a":{"bg":"ftell дава текуща позиция; fseek премества позицията. В двоичен файл SEEK_SET е спрямо началото, SEEK_CUR — текущото място, SEEK_END — края. Проверявай грешките.","en":"ftell reports the current position; fseek repositions. In a binary file, SEEK_SET is relative to the start, SEEK_CUR to the current position and SEEK_END to the end. Check for errors."},"code":"","front":"","source":"10_Files_n.pdf · 5","headers":"","scope":"block"},{"id":"files-16","topic":"files","kind":"how","q":{"bg":"Как да се преместим до запис с индекс k?","en":"How do we seek to record index k?"},"a":{"bg":"При двоичен файл от int отместването е k * sizeof(int). k е неотрицателен и произведението трябва да се побира в long.","en":"For a binary file of int records, the offset is k * sizeof(int). k is nonnegative and the product must fit in long."},"code":"std::FILE* f = std::fopen(\"number.bin\", \"rb\");\nif (f) {\n    long k = 2;\n    if (std::fseek(f, k * static_cast<long>(sizeof(int)), SEEK_SET) == 0) {\n        int x;\n        if (std::fread(&x, sizeof x, 1, f) == 1)\n            std::cout << x;\n    }\n    std::fclose(f);\n}","front":"","source":"10_Files_n.pdf · 5","headers":"cstdio,iostream","scope":"block"},{"id":"files-17","topic":"files","kind":"term","q":{"bg":"remove и rename","en":"remove and rename"},"a":{"bg":"Изтриват файл и преименуват файл. Успехът е 0, неуспехът — ненулев резултат. Затвори отворените потоци преди такава операция.","en":"They remove and rename files. Zero indicates success and nonzero indicates failure. Close open streams before these operations."},"code":"","front":"","source":"10_Files_n.pdf · 6","headers":"","scope":"block"},{"id":"files-18","topic":"files","kind":"read","q":{"bg":"Преносим ли е записът на структура с fwrite?","en":"Is writing a structure with fwrite portable?"},"a":{"bg":"Суровите байтове зависят от подравняване, размери на типове и представяне. Подходящо е само при съвместим формат и прости полета; не записвай така адреси или std::string.","en":"Raw bytes depend on padding, type sizes and representation. Use this only with a compatible format and simple fields; do not serialize pointers or std::string this way."},"code":"","front":"","source":"17.pdf · пример 2; 10_Files_n.pdf · 10–15","headers":"","scope":"block"},{"id":"types-24","topic":"types","kind":"term","q":{"bg":"bool","en":"bool"},"a":{"bg":"Логически тип със стойности true и false. Използва се за резултати от сравнения и логически операции.","en":"A Boolean type with values true and false. Used for results of comparisons and logical operations."},"code":"bool positive = (5 > 0);","front":"","source":"L2_operation.pdf · 4–5","headers":"","scope":"block"},{"id":"pointers-17","topic":"pointers","kind":"read","q":{"bg":"Какво става, ако обикновен new не успее?","en":"What happens if an ordinary new fails?"},"a":{"bg":"По подразбиране хвърля std::bad_alloc. Нулев указател при неуспех се получава с формата new (std::nothrow). Не разчитай на if (!p) след обикновен new като обработка на неуспех.","en":"By default it throws std::bad_alloc. To obtain a null pointer on failure, use new (std::nothrow). Do not rely on if (!p) after ordinary new to handle failure."},"code":"","front":"","source":"L5_Ukazateli.pdf · 7–9","headers":"","scope":"block"},{"id":"ops-25","topic":"ops","kind":"term","q":{"bg":"Побитови |, ^, ~","en":"Bitwise |, ^, ~"},"a":{"bg":"| е побитово ИЛИ, ^ е побитово изключващо ИЛИ, ~ обръща битовете. ^ не е степенуване. При 5 (0101) и 3 (0011): OR е 7, XOR е 6.","en":"| is bitwise OR, ^ is bitwise XOR, and ~ flips bits. ^ is not exponentiation. For 5 (0101) and 3 (0011), OR is 7 and XOR is 6."},"code":"unsigned a = 5u | 3u;\nunsigned b = 5u ^ 3u;","front":"","source":"L2_operation.pdf · 18","headers":"","scope":"block"}]};

const KEY='ur-intro-cpp-cards-v1';
const $=id=>document.getElementById(id);
const byId=new Map(DATA.cards.map(c=>[c.id,c]));
let lang='bg',progress={},order=DATA.cards.map(c=>c.id),mixed=false,storageOK=true,topicValue='all',filterValue='all',query='';
const opened=new Set(),graded=new Set();
let noticeKey='';
try{const stored=JSON.parse(localStorage.getItem(KEY)||'null');if(stored){if(stored.lang==='en')lang='en';if(stored.progress&&typeof stored.progress==='object')for(const [id,p] of Object.entries(stored.progress)){if(!byId.has(id)||!p||!['known','retry'].includes(p.last))continue;const attempts=Number(p.attempts),correct=Number(p.correct);if(Number.isSafeInteger(attempts)&&Number.isSafeInteger(correct)&&attempts>0&&correct>=0&&correct<=attempts)progress[id]={last:p.last,attempts,correct};}}}catch{storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,lang,progress}));storageOK=true}catch{storageOK=false}updateNotice()}
function updateNotice(){const u=UI[lang];$('notice').textContent=!storageOK?u.storageError:(noticeKey?u[noticeKey]:'');$('notice').classList.toggle('warning',!storageOK)}
function percent(a,b){return b?Math.round(a*1000/b)/10:0}
function statusOf(id){return progress[id]?.last||'new'}
function topicName(id){return DATA.topics.find(t=>t.id===id)[lang]}
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function codeNode(code,cls='code-block'){const pre=h('pre',cls),c=h('code');const tokens=code.match(/\/\/[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:int|long|short|unsigned|double|float|char|bool|void|const|static|inline|enum|struct|union|typedef|if|else|for|while|do|switch|case|default|return|break|continue|new|delete|nullptr|true|false|sizeof)\b|\b\d+(?:\.\d+)?(?:[uUlLfF]+)?\b|[^\w\s]|\w+|\s+/g)||[];for(const token of tokens){let cl='';if(token.startsWith('//'))cl='tok-comment';else if(token[0]==='"'||token[0]==="'")cl='tok-string';else if(/^\d/.test(token))cl='tok-num';else if(/^(int|long|short|unsigned|double|float|char|bool|void|const|static|inline|enum|struct|union|typedef|if|else|for|while|do|switch|case|default|return|break|continue|new|delete|nullptr|true|false|sizeof)$/.test(token))cl='tok-key';if(cl)c.append(h('span',cl,token));else c.append(document.createTextNode(token))}pre.append(c);return pre}
function createCard(c){const u=UI[lang],article=h('article','card');article.dataset.id=c.id;article.dataset.status=statusOf(c.id);const meta=h('div','card-meta');meta.append(h('span','',topicName(c.topic)),h('span','card-state',u[statusOf(c.id)==='new'?'new':statusOf(c.id)+'Short']));article.append(meta);const face=h('button','front');face.type='button';face.dataset.action='flip';face.setAttribute('aria-expanded',String(opened.has(c.id)));face.setAttribute('aria-controls','answer-'+c.id);face.append(h('span','question',c.q[lang]));if(c.front){const f=h('span','code-front');f.textContent=c.front;face.append(f)}const hint=h('span','flip-hint');hint.append(h('span','arrow','↶'),h('span','hint-text',u[opened.has(c.id)?'hide':'show']));face.append(hint);article.append(face);const answer=h('div','answer');answer.id='answer-'+c.id;answer.hidden=!opened.has(c.id);answer.append(h('span','answer-label',u.answer),h('p','answer-text',c.a[lang]));if(c.code)answer.append(codeNode(c.code));if(c.headers)answer.append(h('p','requires',u.headers+': '+c.headers.split(',').map(n=>'<'+n.trim()+'>').join(' · ')));const grade=h('div','self-grade');for(const state of ['retry','known']){const b=h('button','grade-'+state,u[state]);b.type='button';b.dataset.action=state;b.disabled=graded.has(c.id);grade.append(b)}answer.append(grade);const result=h('p','grade-result',graded.has(c.id)?u.gradeSaved:'');result.setAttribute('aria-live','polite');answer.append(result);const source=h('details','source');source.append(h('summary','',u.source),h('p','',c.source),h('p','',u.sourceNote));answer.append(source);article.append(answer);return article}
function cardMatches(c){if(topicValue!=='all'&&c.topic!==topicValue)return false;if(filterValue!=='all'&&statusOf(c.id)!==filterValue)return false;if(query){const text=[c.q[lang],c.a[lang],c.code,c.front].join(' ').toLocaleLowerCase(lang);if(!text.includes(query.toLocaleLowerCase(lang)))return false}return true}
function updateStats(){const u=UI[lang],known=Object.values(progress).filter(p=>p.last==='known').length,attempts=Object.values(progress).reduce((n,p)=>n+p.attempts,0),correct=Object.values(progress).reduce((n,p)=>n+p.correct,0),total=DATA.cards.length;$('mastery').textContent=u.mastery+': '+known+'/'+total+' · '+percent(known,total)+'%';$('accuracy').textContent=u.accuracy+': '+correct+'/'+attempts+' · '+(attempts?percent(correct,attempts)+'%':'—');$('progressFill').style.width=percent(known,total)+'%';$('progressBar').setAttribute('aria-label',u.mastery);$('progressBar').setAttribute('aria-valuenow',String(percent(known,total)));document.querySelectorAll('[data-topic-progress]').forEach(e=>{const id=e.dataset.topicProgress,cards=id==='all'?DATA.cards:DATA.cards.filter(c=>c.topic===id),n=cards.filter(c=>statusOf(c.id)==='known').length;e.textContent=n+'/'+cards.length+' · '+percent(n,cards.length)+'% '+u.topicStats})}
function renderDeck(){const u=UI[lang],deck=$('deck');deck.replaceChildren();const visible=order.map(id=>byId.get(id)).filter(cardMatches);$('filterCount').textContent=u.showing+': '+visible.length+' '+u.of+' '+DATA.cards.length;if(!visible.length){deck.append(h('p','empty',u.noResults));updateStats();return}const groups=mixed?[{id:'all',cards:visible}]:DATA.topics.map(t=>({id:t.id,cards:visible.filter(c=>c.topic===t.id)})).filter(g=>g.cards.length);for(const g of groups){const section=h('section','topic-section'),heading=h('div','section-title'),title=h('h2');if(g.id==='all')title.textContent=u.mixed;else{title.append(h('span','index',String(DATA.topics.findIndex(t=>t.id===g.id)+1).padStart(2,'0')),document.createTextNode(topicName(g.id)))}const stat=h('span','section-progress');stat.dataset.topicProgress=g.id;heading.append(title,stat);const grid=h('div','cards');for(const c of g.cards)grid.append(createCard(c));section.append(heading,grid);deck.append(section)}updateStats()}
function renderUI(){const u=UI[lang];document.documentElement.lang=lang;document.title=u.title;$('pageTitle').textContent=u.title;$('controls').setAttribute('aria-label',u.controls);$('topicLabel').textContent=u.topic;$('searchLabel').textContent=u.search;$('search').placeholder=u.search;$('statusLabel').textContent=u.status;$('language').textContent=lang==='bg'?'English':'Български';$('language').setAttribute('aria-label',u.lang);for(const id of ['shuffle','group','helpLabel','reset'])$(id).textContent=u[id==='helpLabel'?'help':id];$('instructions').replaceChildren(...u.instructions.map(x=>h('li','',x)));$('progressExplanation').textContent=u.progressExplanation;$('localExplanation').textContent=u.localExplanation;$('resetMessage').textContent=u.resetPrompt;$('cancelReset').textContent=u.cancel;$('confirmReset').textContent=u.confirmReset;$('topic').replaceChildren();for(const t of [{id:'all',[lang]:u.all},...DATA.topics]){const opt=h('option','',t[lang]);opt.value=t.id;$('topic').append(opt)}$('topic').value=topicValue;$('status').replaceChildren();for(const [value,label] of [['all',u.allCards],['new',u.newCards],['retry',u.retryCards],['known',u.knownCards]]){const opt=h('option','',label);opt.value=value;$('status').append(opt)}$('status').value=filterValue;renderDeck();updateNotice()}
$('deck').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const article=button.closest('.card'),id=article.dataset.id,action=button.dataset.action;if(action==='flip'){const isOpen=opened.has(id);if(isOpen){opened.delete(id);graded.delete(id)}else opened.add(id);article.querySelector('.answer').hidden=isOpen;button.setAttribute('aria-expanded',String(!isOpen));button.querySelector('.hint-text').textContent=UI[lang][isOpen?'show':'hide'];article.querySelectorAll('.self-grade button').forEach(b=>b.disabled=graded.has(id));article.querySelector('.grade-result').textContent=graded.has(id)?UI[lang].gradeSaved:'';return}if(!opened.has(id)||graded.has(id))return;const p=progress[id]||{attempts:0,correct:0};progress[id]={last:action,attempts:p.attempts+1,correct:p.correct+(action==='known'?1:0)};graded.add(id);article.dataset.status=action;article.querySelector('.card-state').textContent=UI[lang][action+'Short'];article.querySelector('.grade-result').textContent=UI[lang].gradeSaved;article.querySelectorAll('.self-grade button').forEach(b=>b.disabled=true);save();if(filterValue!=='all')renderDeck();else updateStats()});
$('topic').onchange=()=>{topicValue=$('topic').value;renderDeck()};$('status').onchange=()=>{filterValue=$('status').value;renderDeck()};$('search').oninput=()=>{query=$('search').value.trim();renderDeck()};$('language').onclick=()=>{lang=lang==='bg'?'en':'bg';save();renderUI()};
$('shuffle').onclick=()=>{order=DATA.cards.map(c=>c.id);for(let i=order.length-1;i>0;--i){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}mixed=true;topicValue='all';filterValue='all';query='';$('topic').value='all';$('status').value='all';$('search').value='';opened.clear();graded.clear();noticeKey='shuffleNotice';renderDeck();updateNotice()};
$('group').onclick=()=>{mixed=false;order=DATA.cards.map(c=>c.id);noticeKey='groupNotice';renderDeck();updateNotice()};
$('reset').onclick=()=>$('resetDialog').showModal();$('cancelReset').onclick=()=>$('resetDialog').close();$('confirmReset').onclick=()=>{progress={};graded.clear();noticeKey='resetDone';save();renderDeck();$('resetDialog').close()};
renderUI();
</script>
</body>
