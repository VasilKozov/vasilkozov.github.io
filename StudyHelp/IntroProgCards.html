<style>
:root{color-scheme:light;--paper:#f7f6ef;--ink:#152f34;--muted:#526866;--line:#d6dfd4;--teal:#12695d;--lime:#d9ee8c;--pale:#edf2e7;--orange:#b4552c;--orange-pale:#fcf0e7;--code:#112c32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 13px;font-size:14px;font-weight:700;min-height:42px}button:hover{border-color:var(--teal);background:var(--pale)}button:disabled{cursor:default;opacity:.6}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--orange);outline-offset:3px}main{max-width:1240px;margin:auto;padding:20px 25px 45px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.controls{position:sticky;top:0;z-index:5;background:rgba(247,246,239,.98);padding:0 0 14px;border-bottom:1px solid var(--line)}.control-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.control-row+.control-row{margin-top:10px}select,input{min-height:42px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:8px 12px;font-size:14px;max-width:100%}#topic{max-width:320px;flex:1 1 220px}#search{flex:1 1 160px;min-width:100px}#status{max-width:225px}#language{min-width:86px}#shuffle{background:var(--ink);color:white;border-color:var(--ink)}#shuffle:hover{background:var(--teal)}.stats{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}.stats strong{color:var(--ink);font-variant-numeric:tabular-nums}.mini-progress{height:5px;flex:1 1 90px;max-width:150px;background:#e0e6d9;border-radius:5px;overflow:hidden}.mini-progress span{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}.controls details{margin-left:auto;font-size:13px}.controls summary{cursor:pointer;color:var(--teal);font-weight:650;list-style-position:inside}.help{position:absolute;right:0;top:100%;padding:18px 20px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #152f3420;width:min(440px,100%);color:var(--muted);font-size:14px}.help p{margin:0 0 10px}.help p:last-child{margin-bottom:0}.help ol{margin:0 0 12px;padding-left:22px}.help li{padding:2px 0}.help #reset{color:var(--orange);border-color:#dcc4b4}.notice{font-size:13px;color:var(--teal);margin:11px 0 0}.notice:empty{display:none}.notice.warning{color:var(--orange)}.topic-section{margin-top:31px;scroll-margin-top:160px}.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}.section-title h2{font-size:20px;line-height:1.3;letter-spacing:-.025em;margin:0}.section-title h2 .index{display:inline-block;font-size:12px;letter-spacing:.08em;color:var(--teal);margin-right:9px}.section-title .section-progress{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 2px 0 #193e3510;transition:border-color .15s}.card[data-status="known"]{border-color:#83ad8b}.card[data-status="retry"]{border-color:#d4b398}.card-meta{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:13px 18px 0;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.025em}.card-state{border-radius:20px;padding:2px 8px;background:#f1f4eb;color:var(--muted);font-size:11px;white-space:nowrap}.card[data-status="known"] .card-state{background:#e2f0d9;color:#28614c}.card[data-status="retry"] .card-state{background:var(--orange-pale);color:#8a4227}.front{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:15px;width:100%;padding:18px;border:0;border-radius:0;min-height:175px;background:transparent;cursor:pointer}.front:hover{border:0;background:#f6f8f1}.question{font-size:23px;line-height:1.3;font-weight:750;letter-spacing:-.025em;overflow-wrap:anywhere}.front .flip-hint{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--teal);margin-top:auto;padding-top:3px}.flip-hint .arrow{font-size:17px}.code-front,.code-block{display:block;font:13px/1.65 "Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4}.code-front{background:var(--pale);padding:12px;border-radius:8px;width:100%;color:var(--ink);font-weight:500}.answer{border-top:1px dashed var(--line);padding:17px 18px 15px;background:#fafcf6}.answer-label{display:block;font-size:10px;font-weight:800;color:var(--teal);letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}.answer-text{font-size:15px;line-height:1.65;margin:0 0 12px;white-space:pre-line;overflow-wrap:anywhere}.code-block{background:var(--code);color:#eaf2ed;border-radius:10px;padding:14px;margin:11px 0;font-size:12px;line-height:1.75;overflow-x:auto;white-space:pre;overflow-wrap:normal}.tok-key{color:#d9ee8c}.tok-string{color:#f4c9a8}.tok-num{color:#95d7d5}.tok-comment{color:#a4b7ae}.requires{font-size:11px;color:var(--muted);margin:9px 0;overflow-wrap:anywhere}.self-grade{display:flex;gap:8px;margin:14px 0 0}.self-grade button{flex:1;font-size:12px;padding:9px 7px}.grade-known{background:var(--lime);border-color:#c1d671}.grade-known:hover{background:#c9e37c}.grade-retry{background:var(--orange-pale);border-color:#e8cdbc}.grade-result{min-height:18px;margin:7px 0 0;font-size:11px;color:var(--muted)}.source{font-size:10px;color:var(--muted);margin-top:12px;line-height:1.5}.source summary{cursor:pointer}.source p{margin:6px 0 0;overflow-wrap:anywhere}.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;margin-top:25px}.filter-count{font-size:12px;color:var(--muted);margin:16px 0 0}.reset-dialog{border:1px solid var(--line);border-radius:15px;padding:24px;max-width:min(420px,90vw);color:var(--ink);background:var(--paper)}.reset-dialog::backdrop{background:#102e32a0}.reset-dialog p{margin:0 0 20px}.reset-actions{display:flex;justify-content:flex-end;gap:10px}#confirmReset{background:var(--orange);color:white;border-color:var(--orange)}[hidden]{display:none!important}@media(max-width:1020px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.control-row{gap:7px}.controls{padding-top:8px}main{padding-top:8px}}@media(max-width:640px){main{padding:5px 14px 30px}.cards{grid-template-columns:minmax(0,1fr);gap:14px}.controls{position:static;padding-top:8px}.control-row{gap:7px}#topic{flex:1 1 calc(100% - 100px);max-width:none;order:0}#language{order:1}#shuffle{order:2;flex:1}#group{order:3;flex:1}.control-row select,.control-row input{font-size:13px}.stats{gap:5px 12px}.mini-progress{max-width:none;flex-basis:100%}.controls details{margin-left:0}.help{position:static;width:100%;margin-top:12px;box-shadow:none}.controls details[open]{flex-basis:100%}.question{font-size:24px}.front{min-height:160px}.topic-section{margin-top:25px}.code-block{font-size:12px}.section-title h2{font-size:19px}.card-meta{font-size:10px}.notice{margin-top:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{.controls,.self-grade,.flip-hint,.filter-count,.grade-result{display:none}.cards{display:block}.card{break-inside:avoid;margin-bottom:16px;box-shadow:none}.answer[hidden]{display:block!important}.front{min-height:0}.code-block{color:black;background:#f1f1f1;white-space:pre-wrap}.tok-key,.tok-string,.tok-num,.tok-comment{color:inherit}.topic-section{break-before:page}.topic-section:first-child{break-before:auto}main{max-width:none;padding:0}.question{font-size:17px}}
</style>

<main>
<h1 class="sr-only" id="pageTitle"></h1>
<div class="controls" role="region" aria-label="Карти и напредък" id="controls">
  <div class="control-row">
    <label class="sr-only" for="topic" id="topicLabel"></label><select id="topic"></select>

<script>
const DATA={"topics":[{"id":"types","bg":"Типове и основни понятия","en":"Types and fundamentals"},{"id":"ops","bg":"Операции и вход/изход","en":"Operators and input/output"},{"id":"control","bg":"Разклонения и цикли","en":"Branches and loops"},{"id":"arrays","bg":"Масиви и матрици","en":"Arrays and matrices"},{"id":"pointers","bg":"Указатели и динамична памет","en":"Pointers and dynamic memory"},{"id":"functions","bg":"Функции","en":"Functions"},{"id":"strings","bg":"Символни низове","en":"C strings"},{"id":"recursion","bg":"Рекурсия","en":"Recursion"},{"id":"structs","bg":"Структури и обединения","en":"Structures and unions"},{"id":"files","bg":"Файлове","en":"Files"}],"cards":[{"id":"types-01","topic":"types","kind":"term","q":{"bg":"int","en":"int"},"a":{"bg":"Целочислен тип за стойности без дробна част. В показаната в лекцията среда заема 4 байта; точният размер зависи от реализацията.","en":"An integer type for values without a fractional part. It occupies 4 bytes in the lecture’s environment; the exact size depends on the implementation."},"code":"int count = 12;","front":"","source":"L1_tipovedanni.pdf · 4–6","headers":"","scope":"block"},{"id":"types-02","topic":"types","kind":"term","q":{"bg":"float","en":"float"},"a":{"bg":"Тип за реални числа с плаваща запетая. Обикновено има по-малка точност от double. Суфиксът f означава литерал от тип float.","en":"A floating-point type for real numbers. It usually has less precision than double. The f suffix makes a literal a float."},"code":"float price = 2.5f;","front":"","source":"L1_tipovedanni.pdf · 4–7","headers":"","scope":"block"},{"id":"types-03","topic":"types","kind":"term","q":{"bg":"double","en":"double"},"a":{"bg":"Тип за реални числа с двойна точност. Дробен литерал без суфикс, например 2.5, е от тип double.","en":"A double-precision floating-point type. A floating literal without a suffix, such as 2.5, has type double."},"code":"double distance = 12.75;","front":"","source":"L1_tipovedanni.pdf · 4–7","headers":"","scope":"block"},{"id":"types-04","topic":"types","kind":"term","q":{"bg":"char","en":"char"},"a":{"bg":"Тип за един кодов елемент на символ; sizeof(char) винаги е 1 байт. Литералът за един обикновен символ е в единични кавички. В някои кодировки една видима буква заема повече байтове.","en":"A type for one character code unit; sizeof(char) is always 1 byte. An ordinary character literal uses single quotes. Included text encodings may use several bytes per displayed character."},"code":"char letter = 'A';","front":"","source":"L1_tipovedanni.pdf · 6–8","headers":"","scope":"block"},{"id":"types-05","topic":"types","kind":"term","q":{"bg":"unsigned int","en":"unsigned int"},"a":{"bg":"Целочислен тип без знак: представя нула и положителни стойности. Не е подходящ за отрицателни резултати.","en":"An unsigned integer type: it represents zero and positive values. It is unsuitable for negative results."},"code":"unsigned int count = 10u;","front":"","source":"L1_tipovedanni.pdf · 4–7","headers":"","scope":"block"},{"id":"types-06","topic":"types","kind":"term","q":{"bg":"short / long","en":"short / long"},"a":{"bg":"Модификатори на целочислен тип. short int и long int могат да се съкратят до short и long. Размерите зависят от реализацията.","en":"Integer type modifiers. short int and long int may be shortened to short and long. Their sizes depend on the implementation."},"code":"short year = 2026;\nlong population = 1000000L;","front":"","source":"L1_tipovedanni.pdf · 4–7","headers":"","scope":"block"},{"id":"types-07","topic":"types","kind":"term","q":{"bg":"void във функция","en":"void in a function"},"a":{"bg":"Означава, че функцията не връща стойност. Действията ѝ може да променят данни или да извеждат резултат.","en":"It means that the function returns no value. Its actions may change data or produce output."},"code":"void printNumber(int x) {\n    std::cout << x;\n}","front":"","source":"L1_tipovedanni.pdf · 6","headers":"iostream","scope":"global"},{"id":"types-08","topic":"types","kind":"term","q":{"bg":"Променлива","en":"Variable"},"a":{"bg":"Именуван обект с тип и стойност, която може да се променя. Дефинирай го преди употреба и задай стойност преди прочитане.","en":"A named object with a type and a value that can change. Define it before use and give it a value before reading it."},"code":"int score = 0;\nscore = 5;","front":"","source":"L1_tipovedanni.pdf · 9","headers":"","scope":"block"},{"id":"types-09","topic":"types","kind":"term","q":{"bg":"Инициализация и присвояване","en":"Initialization and assignment"},"a":{"bg":"Инициализацията задава начална стойност при създаване. Присвояването променя стойността на вече създаден обект.","en":"Initialization supplies a value when the object is created. Assignment changes the value of an existing object."},"code":"int x = 2;\nx = 7;","front":"","source":"L1_tipovedanni.pdf · 3–4, 9","headers":"","scope":"block"},{"id":"types-10","topic":"types","kind":"term","q":{"bg":"const","en":"const"},"a":{"bg":"Обявява обект, чиято стойност не може да се променя чрез това име. Именуваната константа се инициализира при дефиниране.","en":"Declares an object whose value cannot be changed through that name. Initialize a named constant when defining it."},"code":"const double pi = 3.14159;","front":"","source":"L1_tipovedanni.pdf · 8–9","headers":"","scope":"block"},{"id":"types-11","topic":"types","kind":"term","q":{"bg":"Идентификатор","en":"Identifier"},"a":{"bg":"Име на променлива, функция или друг елемент. За примерите използвай латински букви, цифри и _. Не започвай с цифра; големите и малките букви се различават.","en":"A name for a variable, function or another element. Use Latin letters, digits and _ in these examples. Do not start with a digit; letter case matters."},"code":"int studentCount = 0;","front":"","source":"L1_tipovedanni.pdf · 2","headers":"","scope":"block"},{"id":"types-12","topic":"types","kind":"term","q":{"bg":"Ключова дума","en":"Keyword"},"a":{"bg":"Запазена дума със значение в езика. Не може да бъде име на твоя променлива: int, if, for, return са примери.","en":"A reserved word with a language-defined meaning. It cannot name your variable: int, if, for and return are examples."},"code":"","front":"","source":"L1_tipovedanni.pdf · 1–2","headers":"","scope":"block"},{"id":"types-13","topic":"types","kind":"term","q":{"bg":"Коментар на един ред","en":"Single-line comment"},"a":{"bg":"Започва с // и продължава до края на реда. Служи за пояснение и не е изпълним код.","en":"It starts with // and continues to the end of the line. It explains the code and is not executed."},"code":"int count = 0; // number of items","front":"","source":"L1_tipovedanni.pdf · 3","headers":"","scope":"block"},{"id":"types-14","topic":"types","kind":"term","q":{"bg":"Коментар на няколко реда","en":"Multi-line comment"},"a":{"bg":"Текстът между /* и */ е коментар. Такива коментари не се влагат един в друг.","en":"Text between /* and */ is a comment. These comments cannot be nested."},"code":"/* Initial value */\nint sum = 0;","front":"","source":"L1_tipovedanni.pdf · 3","headers":"","scope":"block"},{"id":"types-15","topic":"types","kind":"read","q":{"bg":"Каква е разликата между 'A' и \"A\"?","en":"What is the difference between 'A' and \"A\"?"},"a":{"bg":"'A' е символен литерал. \"A\" е низ: съдържа A и крайния символ \\0, общо два char елемента.","en":"'A' is a character literal. \"A\" is a string: A followed by \\0, for a total of two char elements."},"code":"char ch = 'A';\nchar text[] = \"A\";","front":"","source":"L1_tipovedanni.pdf · 7–8","headers":"","scope":"block"},{"id":"types-16","topic":"types","kind":"term","q":{"bg":"\\n, \\t, \\\\","en":"\\n, \\t, \\\\"},"a":{"bg":"Екранирани последователности: нов ред, хоризонтална табулация и самата обратна наклонена черта.","en":"Escape sequences for a newline, horizontal tab and the backslash itself."},"code":"std::cout << \"A\\tB\\n\";","front":"","source":"L1_tipovedanni.pdf · 8","headers":"iostream","scope":"block"},{"id":"types-17","topic":"types","kind":"term","q":{"bg":"Какво означава \\0 в символен низ?","en":"What does \\0 mean in a C string?"},"a":{"bg":"Нулевият символ отбелязва края на C низа. Той е различен от цифрата '0'.","en":"The null character marks the end of a C string. It differs from the digit '0'."},"code":"char s[] = {'h', 'i', '\\0'};","front":"","source":"L1_tipovedanni.pdf · 8","headers":"","scope":"block"},{"id":"types-18","topic":"types","kind":"read","q":{"bg":"0xAF и 023","en":"0xAF and 023"},"a":{"bg":"Префиксът 0x означава шестнадесетична константа: 0xAF = 175. Водеща 0 означава осмична: 023 = 19, а не 23.","en":"The 0x prefix marks hexadecimal: 0xAF = 175. A leading 0 marks octal: 023 = 19, not 23."},"code":"","front":"","source":"L1_tipovedanni.pdf · 2, 6–7","headers":"","scope":"block"},{"id":"types-19","topic":"types","kind":"term","q":{"bg":"enum","en":"enum"},"a":{"bg":"Изброен тип с именувани стойности. Без изрични стойности изброителите започват от 0 и нарастват с 1.","en":"An enumeration type with named values. Without explicit values, enumerators start at 0 and increase by 1."},"code":"enum Color { red, blue, white };\nColor chosen = blue;","front":"","source":"L1_tipovedanni.pdf · 10–11","headers":"","scope":"block"},{"id":"types-20","topic":"types","kind":"read","q":{"bg":"Каква стойност има white?","en":"What value does white have?"},"a":{"bg":"3. red започва от 0, blue е зададено като 2, а следващата стойност е 3.","en":"3. red starts at 0, blue is explicitly 2, and the next value is 3."},"code":"","front":"enum Color { red, blue = 2, white, black = 5 };","source":"L1_tipovedanni.pdf · 10","headers":"","scope":"block"},{"id":"types-21","topic":"types","kind":"term","q":{"bg":"Декларация и дефиниция","en":"Declaration and definition"},"a":{"bg":"Декларацията съобщава име и тип. Дефиницията също е декларация и създава обекта или задава тялото на функцията.","en":"A declaration introduces a name and its type. A definition is also a declaration and creates the object or supplies the function body."},"code":"int sum(int, int);","front":"","source":"L1_tipovedanni.pdf · 3–4","headers":"","scope":"global"},{"id":"types-22","topic":"types","kind":"term","q":{"bg":"typedef","en":"typedef"},"a":{"bg":"Дава друго име на съществуващ тип; не създава отделен нов тип.","en":"Gives an existing type another name; it does not create a distinct new type."},"code":"typedef unsigned char Byte;\nByte value = 10;","front":"","source":"L2_operation.pdf · 14–15","headers":"","scope":"block"},{"id":"types-23","topic":"types","kind":"term","q":{"bg":"Псевдоним (референция)","en":"Reference"},"a":{"bg":"Второ име на същия обект. Промяната чрез псевдонима променя оригинала. Референцията се свързва при инициализация.","en":"Another name for the same object. Changing it changes the original. A reference is bound during initialization."},"code":"int x = 8;\nint& alias = x;\nalias = 12;","front":"","source":"L2_operation.pdf · 15–16","headers":"","scope":"block"},{"id":"ops-01","topic":"ops","kind":"read","q":{"bg":"7 / 2","en":"7 / 2"},"a":{"bg":"Резултатът е 3: двата операнда са цели числа и дробната част се отхвърля. При отрицателен резултат отрязването е към нулата.","en":"The result is 3: both operands are integers and the fractional part is discarded. A negative result is truncated toward zero."},"code":"","front":"","source":"L2_operation.pdf · 2","headers":"","scope":"block"},{"id":"ops-02","topic":"ops","kind":"how","q":{"bg":"Как да получим 2.5 от 5 и 2?","en":"How do we obtain 2.5 from 5 and 2?"},"a":{"bg":"Преобразувай единия операнд преди делението. Присвояване към double след целочислено деление не връща загубената дробна част.","en":"Convert one operand before division. Assigning an integer division to double afterwards cannot recover its lost fraction."},"code":"int a = 5, b = 2;\ndouble result = static_cast<double>(a) / b;","front":"","source":"L2_operation.pdf · 10–11","headers":"","scope":"block"},{"id":"ops-03","topic":"ops","kind":"term","q":{"bg":"%","en":"%"},"a":{"bg":"Остатък при целочислено деление. Използва се само с цели числа; делителят трябва да е различен от нула.","en":"Remainder after integer division. Use integer operands and a nonzero divisor."},"code":"int remainder = 17 % 5;","front":"","source":"L2_operation.pdf · 2","headers":"","scope":"block"},{"id":"ops-04","topic":"ops","kind":"how","q":{"bg":"Как се проверява четно число?","en":"How do we test whether an integer is even?"},"a":{"bg":"Остатъкът при деление на 2 трябва да е 0. За нечетно използвай != 0; така работи и за отрицателни числа.","en":"Its remainder on division by 2 must be 0. Test odd numbers with != 0; this also works for negative integers."},"code":"int n = -3;\nbool even = (n % 2 == 0);\nbool odd = (n % 2 != 0);","front":"","source":"L2_operation.pdf · 2, 4","headers":"","scope":"block"},{"id":"ops-05","topic":"ops","kind":"term","q":{"bg":"= и ==","en":"= and =="},"a":{"bg":"= присвоява стойност. == сравнява за равенство и дава true или false.","en":"= assigns a value. == compares for equality and yields true or false."},"code":"int x = 5;\nbool same = (x == 5);","front":"","source":"L2_operation.pdf · 4–6","headers":"","scope":"block"},{"id":"ops-06","topic":"ops","kind":"term","q":{"bg":"!=, <, <=, >, >=","en":"!=, <, <=, >, >="},"a":{"bg":"Сравняват съответно за различие, по-малко, по-малко или равно, по-голямо и по-голямо или равно. Резултатът е bool.","en":"They compare for inequality, less than, less than or equal, greater than, and greater than or equal. The result is bool."},"code":"","front":"","source":"L2_operation.pdf · 4","headers":"","scope":"block"},{"id":"ops-07","topic":"ops","kind":"term","q":{"bg":"&&","en":"&&"},"a":{"bg":"Логическо И: истина само ако и двете условия са истина. При false отляво десният операнд не се изчислява.","en":"Logical AND: true only if both conditions are true. If the left operand is false, the right operand is not evaluated."},"code":"int x = 5;\nbool inside = (x >= 0 && x <= 10);","front":"","source":"L2_operation.pdf · 5","headers":"","scope":"block"},{"id":"ops-08","topic":"ops","kind":"term","q":{"bg":"||","en":"||"},"a":{"bg":"Логическо ИЛИ: истина, ако поне едно условие е истина. При true отляво десният операнд не се изчислява.","en":"Logical OR: true if at least one condition is true. If the left operand is true, the right operand is not evaluated."},"code":"int x = 12;\nbool outside = (x < 0 || x > 10);","front":"","source":"L2_operation.pdf · 5","headers":"","scope":"block"},{"id":"ops-09","topic":"ops","kind":"term","q":{"bg":"!","en":"!"},"a":{"bg":"Логическо отрицание: превръща истина в лъжа и обратно. Нула се преобразува в false, ненулевата стойност — в true.","en":"Logical NOT: reverses true and false. Zero converts to false and a nonzero value to true."},"code":"bool ready = false;\nbool waiting = !ready;","front":"","source":"L2_operation.pdf · 5","headers":"","scope":"block"},{"id":"ops-10","topic":"ops","kind":"read","q":{"bg":"Кой е приоритетът: !, && или ||?","en":"What is the precedence of !, && and ||?"},"a":{"bg":"От най-висок към най-нисък: !, &&, ||. Използвай скоби, когато това прави условието по-ясно.","en":"From highest to lowest: !, &&, ||. Use parentheses whenever they clarify the condition."},"code":"","front":"","source":"L2_operation.pdf · 1, 5","headers":"","scope":"block"},{"id":"ops-11","topic":"ops","kind":"term","q":{"bg":"+=, -=, *=, /=, %=","en":"+=, -=, *=, /=, %="},"a":{"bg":"Съкратено присвояване: при обикновена числова променлива x += y означава x = x + y. Аналогично за останалите операции.","en":"Compound assignment: for an ordinary numeric variable, x += y means x = x + y. The other operations work similarly."},"code":"int sum = 3;\nsum += 7;","front":"","source":"L2_operation.pdf · 6","headers":"","scope":"block"},{"id":"ops-12","topic":"ops","kind":"read","q":{"bg":"Какви са x и y след този код?","en":"What are x and y after this code?"},"a":{"bg":"x = 4, y = 4. Префиксното ++ първо увеличава x, после дава новата стойност.","en":"x = 4, y = 4. Prefix ++ increments x first, then yields the new value."},"code":"","front":"int x = 3;\nint y = ++x;","source":"L2_operation.pdf · 4","headers":"","scope":"block"},{"id":"ops-13","topic":"ops","kind":"read","q":{"bg":"Какви са x и y след този код?","en":"What are x and y after this code?"},"a":{"bg":"x = 4, y = 3. Постфиксното ++ дава старата стойност и увеличава x.","en":"x = 4, y = 3. Postfix ++ yields the old value and increments x."},"code":"","front":"int x = 3;\nint y = x++;","source":"L2_operation.pdf · 4","headers":"","scope":"block"},{"id":"ops-14","topic":"ops","kind":"read","q":{"bg":"Какъв е резултатът: 2 + 3 * 4?","en":"What is the result of 2 + 3 * 4?"},"a":{"bg":"14. Умножението има по-висок приоритет. (2 + 3) * 4 би дало 20.","en":"14. Multiplication has higher precedence. (2 + 3) * 4 would produce 20."},"code":"","front":"","source":"L2_operation.pdf · 1–3","headers":"","scope":"block"},{"id":"ops-15","topic":"ops","kind":"term","q":{"bg":"Условният оператор ?:","en":"The conditional operator ?:"},"a":{"bg":"Избира една от две стойности според условие. Изчислява се само избраният от двата клона.","en":"Selects one of two values according to a condition. Only the selected branch is evaluated."},"code":"int a = 4, b = 9;\nint maximum = (a > b) ? a : b;","front":"","source":"L2_operation.pdf · 17","headers":"","scope":"block"},{"id":"ops-16","topic":"ops","kind":"term","q":{"bg":"sizeof","en":"sizeof"},"a":{"bg":"Дава размера на типа или обекта в байтове. Резултатът е std::size_t. Операндът обикновено не се изпълнява. Размерът на int не е универсално 4.","en":"Gives the size of a type or object in bytes. Its result has type std::size_t. The operand is normally not evaluated. int is not universally 4 bytes."},"code":"std::cout << sizeof(int);","front":"","source":"L2_operation.pdf · 16–17","headers":"iostream","scope":"block"},{"id":"ops-17","topic":"ops","kind":"how","q":{"bg":"Как да въведем две числа?","en":"How do we read two numbers?"},"a":{"bg":">> извлича стойности от стандартния вход и ги записва в променливите. Провери състоянието на потока при нужда.","en":">> extracts values from standard input and stores them in variables. Check the stream state when needed."},"code":"int a = 0, b = 0;\nstd::cin >> a >> b;","front":"","source":"L2_operation.pdf · 8–9","headers":"iostream","scope":"block"},{"id":"ops-18","topic":"ops","kind":"how","q":{"bg":"Как да изведем стойност и нов ред?","en":"How do we print a value and a newline?"},"a":{"bg":"<< изпраща данни към стандартния изход. \\n започва нов ред; std::endl също започва ред и допълнително изпразва буфера.","en":"<< sends data to standard output. \\n starts a new line; std::endl also starts a line and additionally flushes the buffer."},"code":"int x = 5;\nstd::cout << \"x = \" << x << '\\n';","front":"","source":"L2_operation.pdf · 7–8","headers":"iostream","scope":"block"},{"id":"ops-19","topic":"ops","kind":"term","q":{"bg":"#include <iostream>","en":"#include <iostream>"},"a":{"bg":"Директива на предпроцесора за включване на стандартния заглавен файл за потоци. Дава декларациите за std::cin и std::cout.","en":"A preprocessor directive that includes the standard stream header. It provides declarations for std::cin and std::cout."},"code":"","front":"","source":"L2_operation.pdf · 10","headers":"","scope":"block"},{"id":"ops-20","topic":"ops","kind":"term","q":{"bg":"std::sqrt и std::pow","en":"std::sqrt and std::pow"},"a":{"bg":"sqrt(x) намира квадратен корен при x ≥ 0. pow(x, n) пресмята степен; за малка цяла степен може и x*x. Използвай <cmath>.","en":"sqrt(x) computes a square root for x ≥ 0. pow(x, n) computes a power; x*x also works for a small integer power. Use <cmath>."},"code":"double root = std::sqrt(9.0);\ndouble power = std::pow(2.0, 3.0);","front":"","source":"L2_operation.pdf · 3","headers":"cmath","scope":"block"},{"id":"ops-21","topic":"ops","kind":"read","q":{"bg":"Тригонометричните функции работят в…?","en":"Trigonometric functions use…?"},"a":{"bg":"Радиани. Например sin(pi/2) е приблизително 1. Преобразувай градусите в радиани преди извикване.","en":"Radians. For example, sin(pi/2) is approximately 1. Convert degrees to radians before calling."},"code":"double pi = 3.141592653589793;\ndouble radians = 90.0 * pi / 180.0;\ndouble value = std::sin(radians);","front":"","source":"L2_operation.pdf · 3","headers":"cmath","scope":"block"},{"id":"ops-22","topic":"ops","kind":"how","q":{"bg":"Как да вземем абсолютна стойност на реално число?","en":"How do we obtain the absolute value of a real number?"},"a":{"bg":"std::fabs(x) връща |x|. За -2.5 резултатът е 2.5.","en":"std::fabs(x) returns |x|. For -2.5, the result is 2.5."},"code":"double value = std::fabs(-2.5);","front":"","source":"L2_operation.pdf · 3","headers":"cmath","scope":"block"},{"id":"ops-23","topic":"ops","kind":"read","q":{"bg":"Побитово & срещу логическо &&","en":"Bitwise & versus logical &&"},"a":{"bg":"& работи поотделно върху битовете на цели числа. && проверява истинност. При 1 и 2: 1 & 2 е 0, а 1 && 2 е true.","en":"& operates on individual bits of integers. && tests truth values. For 1 and 2: 1 & 2 is 0, whereas 1 && 2 is true."},"code":"","front":"","source":"L2_operation.pdf · 18","headers":"","scope":"block"},{"id":"ops-24","topic":"ops","kind":"read","q":{"bg":"<< и >> върху unsigned число","en":"<< and >> on an unsigned integer"},"a":{"bg":"Изместват битовете наляво и надясно. Тук 3u << 1 е 6u, а 8u >> 1 е 4u. Това е различна употреба от вход/изход с потоци.","en":"They shift bits left and right. Here 3u << 1 is 6u and 8u >> 1 is 4u. This use differs from stream input/output."},"code":"unsigned a = 3u << 1;\nunsigned b = 8u >> 1;","front":"","source":"L2_operation.pdf · 18","headers":"","scope":"block"},{"id":"control-01","topic":"control","kind":"term","q":{"bg":"Блок { ... }","en":"Block { ... }"},"a":{"bg":"Групира поредица от оператори като едно цяло. Използвай го за няколко действия в if или цикъл.","en":"Groups several statements into one unit. Use it for multiple actions in an if or a loop."},"code":"int x = 1;\nif (x > 0) {\n    ++x;\n    std::cout << x;\n}","front":"","source":"L3_UpravOp.pdf · 1","headers":"iostream","scope":"block"},{"id":"control-02","topic":"control","kind":"term","q":{"bg":"if / else","en":"if / else"},"a":{"bg":"Ако условието е истина, се изпълнява първият клон. Иначе се изпълнява else. При кратката форма else липсва.","en":"If the condition is true, the first branch runs. Otherwise, else runs. The short form omits else."},"code":"int a = 8, b = 3, maximum;\nif (a > b) maximum = a;\nelse maximum = b;","front":"","source":"L3_UpravOp.pdf · 1–3","headers":"","scope":"block"},{"id":"control-03","topic":"control","kind":"read","q":{"bg":"Към кой if се отнася else?","en":"Which if does an else belong to?"},"a":{"bg":"Към най-близкия предходен if без else в същата структура. Скобите { } правят намерението ясно.","en":"To the nearest preceding unmatched if in the structure. Braces { } make the intent clear."},"code":"","front":"","source":"L3_UpravOp.pdf · 5–6","headers":"","scope":"block"},{"id":"control-04","topic":"control","kind":"how","q":{"bg":"Как да намерим най-голямото от три числа?","en":"How do we find the largest of three numbers?"},"a":{"bg":"Започни с първото; сравни останалите със запомнения максимум.","en":"Start with the first number; compare the others with the stored maximum."},"code":"int a = 4, b = 9, c = 2;\nint maximum = a;\nif (b > maximum) maximum = b;\nif (c > maximum) maximum = c;","front":"","source":"L3_UpravOp.pdf · 4–5","headers":"","scope":"block"},{"id":"control-05","topic":"control","kind":"how","q":{"bg":"Как да проверим дали отсечки образуват триъгълник?","en":"How do we test whether three lengths form a triangle?"},"a":{"bg":"Трябва да са положителни и сборът на всеки две да е по-голям от третата. Използваме &&.","en":"They must be positive, and the sum of every two must exceed the third. Use &&."},"code":"double a = 3, b = 4, c = 5;\nbool triangle = a > 0 && b > 0 && c > 0\n    && a + b > c && a + c > b && b + c > a;","front":"","source":"7.pdf · пример 1","headers":"","scope":"block"},{"id":"control-06","topic":"control","kind":"how","q":{"bg":"Как се проверява високосна година?","en":"How do we test for a leap year?"},"a":{"bg":"Годината се дели на 400, или се дели на 4 и не се дели на 100. Това е правилото за Григорианския календар.","en":"The year is divisible by 400, or divisible by 4 but not by 100. This is the Gregorian-calendar rule."},"code":"int year = 2024;\nbool leap = year % 400 == 0\n    || (year % 4 == 0 && year % 100 != 0);","front":"","source":"1.pdf · задачи за домашно 2","headers":"","scope":"block"},{"id":"control-07","topic":"control","kind":"term","q":{"bg":"switch / case / default","en":"switch / case / default"},"a":{"bg":"Избор по стойност от целочислен или изброен тип. case задава константна стойност; default е незадължителен клон за липса на съвпадение.","en":"Selection by an integer or enumeration value. case specifies a constant value; default is an optional branch when no value matches."},"code":"int choice = 1;\nswitch (choice) {\ncase 1: std::cout << \"Add\"; break;\ncase 2: std::cout << \"Remove\"; break;\ndefault: std::cout << \"Unknown\";\n}","front":"","source":"L3_UpravOp.pdf · 6–8","headers":"iostream","scope":"block"},{"id":"control-08","topic":"control","kind":"read","q":{"bg":"Защо има break след case?","en":"Why is there a break after a case?"},"a":{"bg":"Прекратява switch. Без него изпълнението продължава към следващите оператори и case етикети.","en":"It exits the switch. Without it, execution continues into subsequent statements and case labels."},"code":"","front":"","source":"L3_UpravOp.pdf · 7","headers":"","scope":"block"},{"id":"control-09","topic":"control","kind":"term","q":{"bg":"while","en":"while"},"a":{"bg":"Цикъл с предусловие: проверява условието преди всяко изпълнение. Тялото може да не се изпълни нито веднъж.","en":"A pre-test loop: checks the condition before each iteration. The body may never execute."},"code":"int i = 0;\nwhile (i < 3) {\n    std::cout << i << ' ' ;\n    ++i;\n}","front":"","source":"L3_UpravOp.pdf · 11–12","headers":"iostream","scope":"block"},{"id":"control-10","topic":"control","kind":"term","q":{"bg":"do … while","en":"do … while"},"a":{"bg":"Цикъл с постусловие: тялото се изпълнява поне веднъж, после се проверява условието. След while (...) има ;.","en":"A post-test loop: the body runs at least once, then the condition is checked. A semicolon follows while (...)."},"code":"int i = 0;\ndo {\n    std::cout << i << ' ' ;\n    ++i;\n} while (i < 3);","front":"","source":"L3_UpravOp.pdf · 8–10","headers":"iostream","scope":"block"},{"id":"control-11","topic":"control","kind":"term","q":{"bg":"for: в какъв ред се изпълнява?","en":"for: what is the execution order?"},"a":{"bg":"Инициализация веднъж → условие → тяло → актуализация → пак условие. При false се излиза.","en":"Initialize once → test → body → update → test again. Exit when the test is false."},"code":"for (int i = 0; i < 3; ++i)\n    std::cout << i << ' ' ;","front":"","source":"L3_UpravOp.pdf · 14–16","headers":"iostream","scope":"block"},{"id":"control-12","topic":"control","kind":"read","q":{"bg":"Колко пъти се изпълнява тялото?","en":"How many times does the body execute?"},"a":{"bg":"4 пъти: i = 0, 1, 2, 3. Ако условието беше i <= 4, щеше да е 5 пъти.","en":"4 times: i = 0, 1, 2, 3. With i <= 4, it would run 5 times."},"code":"","front":"for (int i = 0; i < 4; ++i)\n    std::cout << i;","source":"L3_UpravOp.pdf · 14–15","headers":"iostream","scope":"block"},{"id":"control-13","topic":"control","kind":"term","q":{"bg":"break в цикъл","en":"break in a loop"},"a":{"bg":"Незабавно напуска най-вътрешния обхващащ цикъл. Не напуска всички вложени цикли едновременно.","en":"Immediately exits the innermost enclosing loop. It does not exit all nested loops at once."},"code":"","front":"","source":"L3_UpravOp.pdf · 16–17","headers":"","scope":"block"},{"id":"control-14","topic":"control","kind":"term","q":{"bg":"continue","en":"continue"},"a":{"bg":"Пропуска остатъка от текущата итерация. В for следва актуализацията, после проверката; в while — следващата проверка.","en":"Skips the rest of the current iteration. In a for loop, the update runs before the next test; in a while loop, the next test follows."},"code":"","front":"","source":"L3_UpravOp.pdf · 17–18","headers":"","scope":"block"},{"id":"control-15","topic":"control","kind":"how","q":{"bg":"Как да сумираме числата от 1 до n?","en":"How do we sum the integers from 1 to n?"},"a":{"bg":"Акумулаторът sum започва от 0. Добавяй поредното число на всяка итерация. Тук n е малко, така че няма препълване.","en":"Initialize the accumulator sum to 0. Add each number in turn. n is small here, so the result does not overflow."},"code":"int n = 5;\nint sum = 0;\nfor (int i = 1; i <= n; ++i)\n    sum += i;","front":"","source":"2.pdf · цикъл с параметър; 8.pdf · цикли","headers":"","scope":"block"},{"id":"control-16","topic":"control","kind":"how","q":{"bg":"С какво започва произведение в цикъл?","en":"What is the initial value for a product in a loop?"},"a":{"bg":"С 1, не с 0. Нулата би занулила всяко следващо умножение. Избирай тип и входни граници без препълване.","en":"Start with 1, not 0. Zero would make every later multiplication zero. Choose a type and input bounds that avoid overflow."},"code":"int n = 5;\nlong long product = 1;\nfor (int i = 1; i <= n; ++i)\n    product *= i;","front":"","source":"8.pdf · цикли и цифрови алгоритми","headers":"","scope":"block"},{"id":"control-17","topic":"control","kind":"how","q":{"bg":"Как да намерим средно само на положителните числа?","en":"How do we average only the positive numbers?"},"a":{"bg":"Поддържай сума и брой. Дели само при ненулев брой; без положителни числа няма такава средна стойност.","en":"Maintain a sum and count. Divide only if the count is nonzero; with no positive numbers, this mean is undefined."},"code":"int values[] = {-1, 4, 0, 8};\ndouble sum = 0;\nint count = 0;\nfor (int i = 0; i < 4; ++i)\n    if (values[i] > 0) { sum += values[i]; ++count; }\nif (count > 0)\n    std::cout << sum / count;","front":"","source":"8.pdf · пример 1","headers":"iostream","scope":"block"},{"id":"control-18","topic":"control","kind":"how","q":{"bg":"Как се отделя последната цифра?","en":"How do we extract the last digit?"},"a":{"bg":"За неотрицателно цяло число n: n % 10 дава последната цифра, а n / 10 премахва тази цифра.","en":"For a nonnegative integer n: n % 10 gives its last digit and n / 10 removes that digit."},"code":"int n = 472;\nint digit = n % 10;\nn /= 10;","front":"","source":"L3_UpravOp.pdf · 12–13","headers":"","scope":"block"},{"id":"control-19","topic":"control","kind":"how","q":{"bg":"Как да намерим сумата на цифрите?","en":"How do we find the sum of digits?"},"a":{"bg":"Обработвай последната цифра и я премахвай. За n = 0 резултатът е 0. Този вариант е за неотрицателно n.","en":"Process the last digit and remove it repeatedly. For n = 0, the result is 0. This version requires nonnegative n."},"code":"int n = 472;\nint sum = 0;\nwhile (n > 0) {\n    sum += n % 10;\n    n /= 10;\n}","front":"","source":"2.pdf · пример 2; 8.pdf · задача 1","headers":"","scope":"block"},{"id":"control-20","topic":"control","kind":"how","q":{"bg":"Как да преброим цифрите, включително на 0?","en":"How do we count digits, including those of 0?"},"a":{"bg":"Използвай do-while, за да отчетеш поне една цифра. Така 0 има една цифра. Входът тук е неотрицателен.","en":"Use do-while to count at least one digit. Zero therefore has one digit. The input here is nonnegative."},"code":"int n = 0, count = 0;\ndo {\n    ++count;\n    n /= 10;\n} while (n > 0);","front":"","source":"2.pdf · пример 2","headers":"","scope":"block"},{"id":"control-21","topic":"control","kind":"how","q":{"bg":"Как да обърнем цифрите на число?","en":"How do we reverse a number’s digits?"},"a":{"bg":"Добавяй последната цифра към резултата: reversed * 10 + digit. За 120 се получава 21. Входът е неотрицателен и обърнатото число трябва да се побира в типа.","en":"Append each last digit using reversed * 10 + digit. 120 becomes 21. Input is nonnegative and the reversed result must fit in the type."},"code":"int n = 472, reversed = 0;\nwhile (n > 0) {\n    reversed = reversed * 10 + n % 10;\n    n /= 10;\n}","front":"","source":"L3_UpravOp.pdf · 13","headers":"","scope":"block"},{"id":"control-22","topic":"control","kind":"how","q":{"bg":"Алгоритъм на Евклид (НОД)","en":"Euclid’s algorithm (GCD)"},"a":{"bg":"Докато b ≠ 0, замени двойката (a, b) с (b, a % b). Накрая a е НОД. Входовете са неотрицателни и не са едновременно 0.","en":"While b ≠ 0, replace (a, b) with (b, a % b). At the end a is the GCD. Inputs are nonnegative and not both zero."},"code":"int a = 48, b = 18;\nwhile (b != 0) {\n    int remainder = a % b;\n    a = b;\n    b = remainder;\n}","front":"","source":"2.pdf · задача 1","headers":"","scope":"block"},{"id":"control-23","topic":"control","kind":"how","q":{"bg":"Как да проверим малко число за простота?","en":"How do we test a small integer for primality?"},"a":{"bg":"n трябва да е поне 2. Търси делител от 2 до √n. Условието d <= n/d избягва препълване от d*d.","en":"n must be at least 2. Look for a divisor from 2 to √n. The test d <= n/d avoids overflow from d*d."},"code":"int n = 29;\nbool prime = n >= 2;\nfor (int d = 2; d <= n / d; ++d) {\n    if (n % d == 0) { prime = false; break; }\n}","front":"","source":"8.pdf · задачи за прости числа","headers":"","scope":"block"},{"id":"control-24","topic":"control","kind":"how","q":{"bg":"Защо са нужни вложени цикли?","en":"Why use nested loops?"},"a":{"bg":"За обхождане на комбинации: за всяка стойност на външния индекс вътрешният цикъл се изпълнява отначало. Тук има 2 × 3 = 6 двойки.","en":"To visit combinations: for each outer index, the inner loop starts again. There are 2 × 3 = 6 pairs here."},"code":"for (int i = 0; i < 2; ++i)\n    for (int j = 0; j < 3; ++j)\n        std::cout << i << \",\" << j << '\\n';","front":"","source":"L3_UpravOp.pdf · 18–19","headers":"iostream","scope":"block"},{"id":"arrays-01","topic":"arrays","kind":"term","q":{"bg":"Едномерен масив","en":"One-dimensional array"},"a":{"bg":"Поредица от елементи от един тип в последователна памет. Всеки елемент се достига чрез индекс.","en":"A sequence of elements of one type in contiguous memory. Each element is accessed by its index."},"code":"int a[5];","front":"","source":"L4_Masivi.pdf · 1–2","headers":"","scope":"block"},{"id":"arrays-02","topic":"arrays","kind":"read","q":{"bg":"Индекси на a[5]","en":"Indices of a[5]"},"a":{"bg":"Допустимите индекси са 0, 1, 2, 3, 4. a[5] е извън масива. C++ не проверява автоматично границите на вградените масиви.","en":"Valid indices are 0, 1, 2, 3, 4. a[5] is outside the array. C++ does not automatically check bounds on built-in arrays."},"code":"","front":"","source":"L4_Masivi.pdf · 2","headers":"","scope":"block"},{"id":"arrays-03","topic":"arrays","kind":"how","q":{"bg":"Как се инициализира масив?","en":"How is an array initialized?"},"a":{"bg":"Задай стойности в { }. При частична инициализация останалите елементи стават 0.","en":"Use values in { }. With partial initialization, remaining elements become 0."},"code":"int a[5] = {4, 7};\nint zeros[5] = {};","front":"","source":"L4_Masivi.pdf · 3","headers":"","scope":"block"},{"id":"arrays-04","topic":"arrays","kind":"read","q":{"bg":"Копира ли b = a вградени масиви?","en":"Does b = a copy built-in arrays?"},"a":{"bg":"Не. Вградените масиви не се присвояват като едно цяло. Копирай елементите с цикъл.","en":"No. Built-in arrays cannot be assigned as a whole. Copy their elements in a loop."},"code":"int a[3] = {1, 2, 3}, b[3];\nfor (int i = 0; i < 3; ++i)\n    b[i] = a[i];","front":"","source":"L4_Masivi.pdf · 2","headers":"","scope":"block"},{"id":"arrays-05","topic":"arrays","kind":"how","q":{"bg":"Как да въведем масив?","en":"How do we read an array?"},"a":{"bg":"Задели капацитет и провери n преди обхождане. Индексът върви от 0 до n-1. Приема се валиден целочислен вход.","en":"Allocate capacity and validate n before traversing. The index runs from 0 to n-1. Valid integer input is assumed."},"code":"const int capacity = 100;\nint a[capacity], n = 0;\nstd::cin >> n;\nif (n >= 0 && n <= capacity) {\n    for (int i = 0; i < n; ++i)\n        std::cin >> a[i];\n}","front":"","source":"L4_Masivi.pdf · 3–4","headers":"iostream","scope":"block"},{"id":"arrays-06","topic":"arrays","kind":"how","q":{"bg":"Как да изведем масив?","en":"How do we print an array?"},"a":{"bg":"Обходи всички използвани елементи. Раздели стойностите, за да се четат ясно.","en":"Traverse all used elements. Separate the values so the output is readable."},"code":"int a[] = {4, 2, 8};\nint n = 3;\nfor (int i = 0; i < n; ++i)\n    std::cout << a[i] << ' ' ;","front":"","source":"L4_Masivi.pdf · 3–4","headers":"iostream","scope":"block"},{"id":"arrays-07","topic":"arrays","kind":"how","q":{"bg":"Как да намерим сума на масив?","en":"How do we sum an array?"},"a":{"bg":"Започни от 0 и добави всеки елемент. При празен масив сумата е 0.","en":"Start at 0 and add each element. An empty array has a sum of 0."},"code":"int a[] = {4, -2, 8}, n = 3;\nint sum = 0;\nfor (int i = 0; i < n; ++i)\n    sum += a[i];","front":"","source":"L4_Masivi.pdf · 4","headers":"","scope":"block"},{"id":"arrays-08","topic":"arrays","kind":"how","q":{"bg":"Как да намерим минимална стойност в масив?","en":"How do we find the minimum value in an array?"},"a":{"bg":"За n > 0 започни от a[0], после сравни останалите. Начална стойност 0 би дала грешен резултат за изцяло положителен масив.","en":"For n > 0, start with a[0], then compare the rest. Starting at 0 would fail for an all-positive array."},"code":"int a[] = {7, 4, 9}, n = 3;\nint minimum = a[0];\nfor (int i = 1; i < n; ++i)\n    if (a[i] < minimum) minimum = a[i];","front":"","source":"9.pdf · задача 15; L4_Masivi.pdf · 5","headers":"","scope":"block"},{"id":"arrays-09","topic":"arrays","kind":"how","q":{"bg":"Как да намерим индекса на максимума?","en":"How do we find the index of the maximum?"},"a":{"bg":"Запомни индекс, а не стойност. При > и равни максимуми остава първият. Масивът трябва да е непразен.","en":"Store an index, not a value. With >, equal maxima leave the first occurrence selected. The array must be nonempty."},"code":"int a[] = {5, 9, 9, 3}, n = 4;\nint pos = 0;\nfor (int i = 1; i < n; ++i)\n    if (a[i] > a[pos]) pos = i;","front":"","source":"9.pdf · пример 4","headers":"","scope":"block"},{"id":"arrays-10","topic":"arrays","kind":"how","q":{"bg":"Как да преброим нулевите елементи?","en":"How do we count zero elements?"},"a":{"bg":"Инициализирай брояч с 0 и го увеличавай само при a[i] == 0.","en":"Initialize a counter to 0 and increment it only when a[i] == 0."},"code":"int a[] = {0, 2, 0, -1}, n = 4;\nint count = 0;\nfor (int i = 0; i < n; ++i)\n    if (a[i] == 0) ++count;","front":"","source":"9.pdf · задача 1","headers":"","scope":"block"},{"id":"arrays-11","topic":"arrays","kind":"how","q":{"bg":"Как да намерим първия елемент, равен на key?","en":"How do we find the first element equal to key?"},"a":{"bg":"Линейно търсене: обхождай отляво. Излез при първо съвпадение. -1 означава, че няма такъв индекс.","en":"Linear search: scan from the left. Stop at the first match. -1 means that no matching index exists."},"code":"int a[] = {4, 7, 7}, n = 3, key = 7;\nint pos = -1;\nfor (int i = 0; i < n; ++i) {\n    if (a[i] == key) { pos = i; break; }\n}","front":"","source":"9.pdf · задача 2","headers":"","scope":"block"},{"id":"arrays-12","topic":"arrays","kind":"how","q":{"bg":"Как да отделим ненулевите в нов масив?","en":"How do we copy nonzero values into a new array?"},"a":{"bg":"k е броят на записаните елементи. След филтриране използвай само p[0] … p[k-1].","en":"k counts the stored elements. After filtering, use only p[0] … p[k-1]."},"code":"int a[] = {0, 4, -1, 0}, n = 4;\nint p[4], k = 0;\nfor (int i = 0; i < n; ++i)\n    if (a[i] != 0) p[k++] = a[i];","front":"","source":"9.pdf · задача 3","headers":"","scope":"block"},{"id":"arrays-13","topic":"arrays","kind":"how","q":{"bg":"Как да премахнем само съседните повторения?","en":"How do we remove only adjacent duplicates?"},"a":{"bg":"Запази първия елемент и всеки следващ, различен от предходния. Това не премахва повторения на различни места.","en":"Keep the first element and each later element that differs from its predecessor. This does not remove separated duplicates."},"code":"int a[] = {2, 2, 5, 2}, n = 4;\nint p[4], k = 0;\nfor (int i = 0; i < n; ++i)\n    if (i == 0 || a[i] != a[i - 1])\n        p[k++] = a[i];","front":"","source":"9.pdf · задача 4","headers":"","scope":"block"},{"id":"arrays-14","topic":"arrays","kind":"how","q":{"bg":"Как се проверява ненамаляващ ред?","en":"How do we check nondecreasing order?"},"a":{"bg":"Не трябва да има съседна двойка с a[i] < a[i-1]. Равните съседни стойности са разрешени.","en":"There must be no adjacent pair with a[i] < a[i-1]. Equal adjacent values are allowed."},"code":"int a[] = {1, 2, 2, 8}, n = 4;\nbool sorted = true;\nfor (int i = 1; i < n; ++i)\n    if (a[i] < a[i - 1]) sorted = false;","front":"","source":"11.pdf · пример 1","headers":"","scope":"block"},{"id":"arrays-15","topic":"arrays","kind":"how","q":{"bg":"Как да разменим два елемента?","en":"How do we swap two elements?"},"a":{"bg":"Използвай временна променлива, за да не загубиш първата стойност.","en":"Use a temporary variable to preserve the first value."},"code":"int a[] = {3, 8};\nint temp = a[0];\na[0] = a[1];\na[1] = temp;","front":"","source":"13-14.pdf · задача 1","headers":"","scope":"block"},{"id":"arrays-16","topic":"arrays","kind":"how","q":{"bg":"Сортиране чрез съседни размени","en":"Bubble sort"},"a":{"bg":"Сравнявай съседни елементи и разменяй при грешен ред. След всяко минаване най-големият от оставащите е вдясно.","en":"Compare adjacent elements and swap those in the wrong order. Each pass places the largest remaining value at the right."},"code":"int a[] = {4, 1, 3, 2}, n = 4;\nfor (int i = 0; i < n - 1; ++i)\n    for (int j = 0; j < n - i - 1; ++j)\n        if (a[j] > a[j + 1]) {\n            int t = a[j];\n            a[j] = a[j + 1];\n            a[j + 1] = t;\n        }","front":"","source":"13-14.pdf · задача 1","headers":"","scope":"block"},{"id":"arrays-17","topic":"arrays","kind":"term","q":{"bg":"Кога може двоично търсене?","en":"When can we use binary search?"},"a":{"bg":"Масивът трябва да е подреден според използваното сравнение. Всяка стъпка изключва приблизително половината оставащи елементи.","en":"The array must be sorted according to the comparison used. Each step eliminates approximately half of the remaining elements."},"code":"","front":"","source":"13-14.pdf · задача 2","headers":"","scope":"block"},{"id":"arrays-18","topic":"arrays","kind":"how","q":{"bg":"Как да реализираме двоично търсене?","en":"How do we implement binary search?"},"a":{"bg":"За нарастващо подреден масив. left <= right проверява дали интервалът не е празен; така n = 0 не достъпва масива.","en":"For an ascending array. left <= right checks that the range is nonempty; n = 0 therefore causes no array access."},"code":"int a[] = {2, 5, 8, 12}, n = 4, key = 8;\nint left = 0, right = n - 1, pos = -1;\nwhile (left <= right) {\n    int mid = left + (right - left) / 2;\n    if (a[mid] == key) { pos = mid; break; }\n    if (a[mid] < key) left = mid + 1;\n    else right = mid - 1;\n}","front":"","source":"13-14.pdf · задача 2","headers":"","scope":"block"},{"id":"arrays-19","topic":"arrays","kind":"how","q":{"bg":"Как да вмъкнем стойност в подреден масив?","en":"How do we insert into a sorted array?"},"a":{"bg":"При свободно място измести по-големите надясно, запиши key и увеличи n.","en":"With spare capacity available, shift larger elements right, write key and increment n."},"code":"int a[6] = {1, 3, 7}, n = 3, key = 5;\nint i = n - 1;\nwhile (i >= 0 && a[i] > key) {\n    a[i + 1] = a[i];\n    --i;\n}\na[i + 1] = key;\n++n;","front":"","source":"9.pdf · задача 10","headers":"","scope":"block"},{"id":"arrays-20","topic":"arrays","kind":"how","q":{"bg":"Как да слеем два подредени масива?","en":"How do we merge two sorted arrays?"},"a":{"bg":"Избирай по-малкия текущ елемент. След изчерпване на единия масив копирай останалите от другия.","en":"Choose the smaller current element. After one array is exhausted, copy the remaining elements of the other."},"code":"int a[] = {1, 4}, b[] = {2, 3};\nint m = 2, n = 2, c[4];\nint i = 0, j = 0, k = 0;\nwhile (i < m && j < n)\n    c[k++] = (a[i] <= b[j]) ? a[i++] : b[j++];\nwhile (i < m) c[k++] = a[i++];\nwhile (j < n) c[k++] = b[j++];","front":"","source":"9.pdf · задача 11; L4_Masivi.pdf · 8","headers":"","scope":"block"},{"id":"arrays-21","topic":"arrays","kind":"term","q":{"bg":"Двумерен масив","en":"Two-dimensional array"},"a":{"bg":"Масив от редове. При int a[2][3] има 2 реда и 3 стълба; a[i][j] е елементът в ред i, стълб j.","en":"An array of rows. int a[2][3] has 2 rows and 3 columns; a[i][j] is the element in row i, column j."},"code":"int a[2][3] = {{1, 2, 3}, {4, 5, 6}};","front":"","source":"L4_Masivi.pdf · 12–14","headers":"","scope":"block"},{"id":"arrays-22","topic":"arrays","kind":"how","q":{"bg":"Как да въведем матрица по редове?","en":"How do we read a matrix row by row?"},"a":{"bg":"Външният цикъл избира реда, вътрешният — стълба.","en":"The outer loop selects the row, and the inner loop selects the column."},"code":"const int rows = 2, cols = 3;\nint a[rows][cols];\nfor (int i = 0; i < rows; ++i)\n    for (int j = 0; j < cols; ++j)\n        std::cin >> a[i][j];","front":"","source":"L4_Masivi.pdf · 13–15","headers":"iostream","scope":"block"},{"id":"arrays-23","topic":"arrays","kind":"how","q":{"bg":"Как да намерим сумата на всеки ред?","en":"How do we find the sum of each row?"},"a":{"bg":"Занулявай сумата за всеки нов ред. Не оставяй акумулатора да пренася сумата от предишния ред.","en":"Reset the sum for every new row. Do not carry the previous row’s sum forward."},"code":"int a[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint sums[2] = {};\nfor (int i = 0; i < 2; ++i)\n    for (int j = 0; j < 3; ++j)\n        sums[i] += a[i][j];","front":"","source":"L4_Masivi.pdf · 15","headers":"","scope":"block"},{"id":"arrays-24","topic":"arrays","kind":"how","q":{"bg":"Как да намерим минимума във всеки стълб?","en":"How do we find the minimum in each column?"},"a":{"bg":"Външният цикъл е по стълбове. Началният минимум за стълб j е a[0][j]; нужен е поне един ред.","en":"The outer loop traverses columns. Initialize column j with a[0][j]; at least one row is required."},"code":"int a[2][3] = {{7, 2, 9}, {4, 6, 1}};\nint minima[3];\nfor (int j = 0; j < 3; ++j) {\n    minima[j] = a[0][j];\n    for (int i = 1; i < 2; ++i)\n        if (a[i][j] < minima[j]) minima[j] = a[i][j];\n}","front":"","source":"10.pdf · задача 7","headers":"","scope":"block"},{"id":"arrays-25","topic":"arrays","kind":"term","q":{"bg":"Главен диагонал","en":"Main diagonal"},"a":{"bg":"В квадратен масив елементите с i == j. Над него е j > i, а под него е i > j.","en":"In a square array, elements with i == j. Above it, j > i; below it, i > j."},"code":"int a[3][3] = {{1,2,3}, {4,5,6}, {7,8,9}};\nint sum = 0;\nfor (int i = 0; i < 3; ++i)\n    sum += a[i][i];","front":"","source":"3-4.pdf · пример 3; 10.pdf · задача 9","headers":"","scope":"block"},{"id":"arrays-26","topic":"arrays","kind":"how","q":{"bg":"Как да преброим отрицателните над главния диагонал?","en":"How do we count negatives above the main diagonal?"},"a":{"bg":"За всеки ред i започни стълбовете от i+1. Така се обхождат само j > i.","en":"For row i, start columns at i+1. This visits only j > i."},"code":"int a[3][3] = {{1,-2,3}, {4,5,-6}, {7,8,9}};\nint count = 0;\nfor (int i = 0; i < 3; ++i)\n    for (int j = i + 1; j < 3; ++j)\n        if (a[i][j] < 0) ++count;","front":"","source":"3-4.pdf · пример 3","headers":"","scope":"block"},{"id":"arrays-27","topic":"arrays","kind":"how","q":{"bg":"Как да умножим матрица по вектор?","en":"How do we multiply a matrix by a vector?"},"a":{"bg":"За всеки ред сумирай a[i][j] * v[j]. Дължината на v трябва да е равна на броя стълбове.","en":"For each row, sum a[i][j] * v[j]. The length of v must equal the number of columns."},"code":"int a[2][3] = {{1,2,3}, {4,5,6}};\nint v[3] = {1, 0, 2}, result[2] = {};\nfor (int i = 0; i < 2; ++i)\n    for (int j = 0; j < 3; ++j)\n        result[i] += a[i][j] * v[j];","front":"","source":"L4_Masivi.pdf · 15–16","headers":"","scope":"block"},{"id":"arrays-28","topic":"arrays","kind":"how","q":{"bg":"Схема на Хорнер за полином","en":"Horner’s scheme for a polynomial"},"a":{"bg":"При коефициенти от най-високата степен към свободния член: започни с първия; повтаряй value = value*x + следващия.","en":"For coefficients from highest degree to constant term: start with the first, then repeat value = value*x + next coefficient."},"code":"double a[] = {2, 3, 4};\ndouble x = 5, value = a[0];\nfor (int i = 1; i < 3; ++i)\n    value = value * x + a[i];","front":"","source":"11.pdf · задача 2; 13-14.pdf · задача 3","headers":"","scope":"block"},{"id":"pointers-01","topic":"pointers","kind":"term","q":{"bg":"Указател","en":"Pointer"},"a":{"bg":"Обект, който съхранява адрес. int* сочи към int; *p достъпва обекта, към който p сочи, ако адресът е валиден.","en":"An object that stores an address. int* points to an int; *p accesses the pointed-to object when the address is valid."},"code":"int x = 7;\nint* p = &x;","front":"","source":"L5_Ukazateli.pdf · 1–3","headers":"","scope":"block"},{"id":"pointers-02","topic":"pointers","kind":"term","q":{"bg":"&x","en":"&x"},"a":{"bg":"Оператор за извличане на адрес. Връща адреса на обекта x. Това е различна употреба на & от референция или побитово И.","en":"The address-of operator. It yields the address of object x. This use of & differs from a reference declaration or bitwise AND."},"code":"int x = 7;\nint* p = &x;","front":"","source":"L5_Ukazateli.pdf · 1","headers":"","scope":"block"},{"id":"pointers-03","topic":"pointers","kind":"read","q":{"bg":"Какво става с x?","en":"What happens to x?"},"a":{"bg":"x става 12. Присвояването на *p променя обекта x, защото p сочи към него.","en":"x becomes 12. Assignment to *p changes x because p points to it."},"code":"","front":"int x = 7;\nint* p = &x;\n*p = 12;","source":"L5_Ukazateli.pdf · 2–3","headers":"","scope":"block"},{"id":"pointers-04","topic":"pointers","kind":"term","q":{"bg":"nullptr","en":"nullptr"},"a":{"bg":"Нулева указателна стойност: указателят не сочи към обект. Преди *p трябва да има валиден обект, не само ненулев адрес. В лекциите се използва и старото NULL.","en":"A null pointer value: the pointer points to no object. Dereferencing requires a valid object, not merely a nonzero address. The lectures also use the older NULL."},"code":"int* p = nullptr;","front":"","source":"L5_Ukazateli.pdf · 1–2","headers":"","scope":"block"},{"id":"pointers-05","topic":"pointers","kind":"term","q":{"bg":"Какво означава p + 1?","en":"What does p + 1 mean?"},"a":{"bg":"Преминаване към следващия елемент от сочения тип, не към следващия байт. Адресната аритметика е ограничена до един масив и позицията след края му.","en":"Moving to the next element of the pointed-to type, not the next byte. Pointer arithmetic is limited to one array and its one-past-end position."},"code":"int a[] = {10, 20, 30};\nint* p = a;\n++p;","front":"","source":"L5_Ukazateli.pdf · 2–3","headers":"","scope":"block"},{"id":"pointers-06","topic":"pointers","kind":"term","q":{"bg":"a[i] и *(a + i)","en":"a[i] and *(a + i)"},"a":{"bg":"За валиден индекс означават един и същи елемент. В много изрази името на масива се преобразува в указател към първия елемент.","en":"For a valid index, they refer to the same element. In many expressions, an array name converts to a pointer to its first element."},"code":"int a[] = {10, 20, 30};\nint value = *(a + 1);","front":"","source":"L5_Ukazateli.pdf · 6","headers":"","scope":"block"},{"id":"pointers-07","topic":"pointers","kind":"read","q":{"bg":"int* p, q; — и двете ли са указатели?","en":"int* p, q; — are both pointers?"},"a":{"bg":"Не. Само p е указател; q е int. Звездичката принадлежи на отделния декларатор. За яснота използвай отделни редове.","en":"No. Only p is a pointer; q is an int. The star belongs to each individual declarator. Separate lines improve clarity."},"code":"int* p = nullptr;\nint q = 0;","front":"","source":"L5_Ukazateli.pdf · 1–2","headers":"","scope":"block"},{"id":"pointers-08","topic":"pointers","kind":"term","q":{"bg":"const int* p","en":"const int* p"},"a":{"bg":"Не може да променяш сочения int чрез p. Самият указател може да получи друг адрес.","en":"You cannot modify the pointed-to int through p. The pointer itself may receive another address."},"code":"int a = 1, b = 2;\nconst int* p = &a;\np = &b;","front":"","source":"L5_Ukazateli.pdf · 3–4","headers":"","scope":"block"},{"id":"pointers-09","topic":"pointers","kind":"term","q":{"bg":"int* const p","en":"int* const p"},"a":{"bg":"Указател-константа: адресът не може да се променя след инициализация, но соченият неконстантен обект може.","en":"A constant pointer: its address cannot change after initialization, but the non-const pointed-to object can change."},"code":"int x = 1;\nint* const p = &x;\n*p = 9;","front":"","source":"L5_Ukazateli.pdf · 3–4","headers":"","scope":"block"},{"id":"pointers-10","topic":"pointers","kind":"term","q":{"bg":"void*","en":"void*"},"a":{"bg":"Указател към обект без информация за конкретния му тип. Не може директно да разименуваш void*. За достъп е нужен правилният тип.","en":"An object pointer without a specific pointed-to type. You cannot dereference void* directly. Access requires the correct type."},"code":"int x = 5;\nvoid* raw = &x;\nint* p = static_cast<int*>(raw);","front":"","source":"L5_Ukazateli.pdf · 4–5","headers":"","scope":"block"},{"id":"pointers-11","topic":"pointers","kind":"term","q":{"bg":"int**","en":"int**"},"a":{"bg":"Указател към указател към int. В примера **pp достига до x.","en":"A pointer to a pointer to int. In this example, **pp reaches x."},"code":"int x = 7;\nint* p = &x;\nint** pp = &p;","front":"","source":"L5_Ukazateli.pdf · 5","headers":"","scope":"block"},{"id":"pointers-12","topic":"pointers","kind":"how","q":{"bg":"Как да създадем и освободим динамичен обект?","en":"How do we allocate and release a dynamic object?"},"a":{"bg":"new създава обекта и дава адреса му. delete го унищожава и освобождава паметта. След това не използвай стария адрес.","en":"new creates the object and yields its address. delete destroys it and releases its memory. Do not use the old address afterwards."},"code":"int* p = new int(7);\nstd::cout << *p;\ndelete p;\np = nullptr;","front":"","source":"L5_Ukazateli.pdf · 7–8","headers":"iostream","scope":"block"},{"id":"pointers-13","topic":"pointers","kind":"how","q":{"bg":"Как да създадем динамичен масив?","en":"How do we allocate a dynamic array?"},"a":{"bg":"Размерът може да е определен при изпълнение. new int[n]{} също занулява елементите. new[] се съчетава с delete[].","en":"The size may be determined at runtime. new int[n]{} also zero-initializes the elements. Match new[] with delete[]."},"code":"int n = 5;\nint* a = new int[n]{};\na[0] = 9;\ndelete[] a;\na = nullptr;","front":"","source":"L5_Ukazateli.pdf · 8–9","headers":"","scope":"block"},{"id":"pointers-14","topic":"pointers","kind":"read","q":{"bg":"Защо delete p не заменя delete[] p?","en":"Why can’t delete p replace delete[] p?"},"a":{"bg":"Формата трябва да съответства на заделянето: new → delete, new[] → delete[]. Смесването води до неопределено поведение, включително за int.","en":"The form must match the allocation: new → delete, new[] → delete[]. Mixing them causes undefined behavior, including for int."},"code":"","front":"","source":"L5_Ukazateli.pdf · 8–9","headers":"","scope":"block"},{"id":"pointers-15","topic":"pointers","kind":"term","q":{"bg":"Какво е изтичане на памет?","en":"What is a memory leak?"},"a":{"bg":"Заделена памет остава неосвободена и програмата губи възможността да я управлява. Не губи последния указател преди delete/delete[].","en":"Allocated memory remains unreleased and the program loses the ability to manage it. Do not lose the last pointer before delete/delete[]."},"code":"","front":"","source":"L5_Ukazateli.pdf · 7–9","headers":"","scope":"block"},{"id":"pointers-16","topic":"pointers","kind":"how","q":{"bg":"Как да създадем двумерен динамичен масив?","en":"How do we allocate a dynamic two-dimensional array?"},"a":{"bg":"Първо масив от указатели към редове, после всеки ред. Примерът приема успешни заделяния; при реален код обработвай и неуспеха. Освобождавай в обратен ред.","en":"Allocate an array of row pointers, then each row. This example assumes allocations succeed; production code must also handle failure. Release them in reverse order."},"code":"int rows = 2, cols = 3;\nint** a = new int*[rows];\nfor (int i = 0; i < rows; ++i)\n    a[i] = new int[cols]{};\nfor (int i = 0; i < rows; ++i)\n    delete[] a[i];\ndelete[] a;","front":"","source":"L5_Ukazateli.pdf · 10","headers":"","scope":"block"},{"id":"functions-01","topic":"functions","kind":"term","q":{"bg":"Функция","en":"Function"},"a":{"bg":"Именувана част на програмата за определена задача. Има тип на резултата, име, параметри и тяло. Позволява повторно използване на алгоритъм.","en":"A named part of a program for a specific task. It has a return type, name, parameters and body. It makes an algorithm reusable."},"code":"int maximum(int a, int b) {\n    return (a > b) ? a : b;\n}","front":"","source":"L6_Functions.pdf · 4–6","headers":"","scope":"global"},{"id":"functions-02","topic":"functions","kind":"term","q":{"bg":"Прототип на функция","en":"Function prototype"},"a":{"bg":"Декларация без тяло, завършваща с ;. Дава информация за типа на резултата и параметрите преди извикване.","en":"A declaration without a body, ending in ;. It supplies the return type and parameter types before a call."},"code":"int maximum(int a, int b);","front":"","source":"L6_Functions.pdf · 9","headers":"","scope":"global"},{"id":"functions-03","topic":"functions","kind":"term","q":{"bg":"Формални и действителни аргументи","en":"Parameters and arguments"},"a":{"bg":"Формалните параметри са в декларацията/дефиницията. Действителните аргументи са стойностите или обектите, подадени при извикване.","en":"Parameters appear in the declaration/definition. Arguments are the values or objects supplied by a call."},"code":"int square(int x) { return x * x; }","front":"","source":"L6_Functions.pdf · 5–6","headers":"","scope":"global"},{"id":"functions-04","topic":"functions","kind":"term","q":{"bg":"return","en":"return"},"a":{"bg":"Прекратява текущото изпълнение на функцията и по желание връща резултат. void функция може да използва return; без стойност.","en":"Ends the current function call and may return a result. A void function can use return; without a value."},"code":"int square(int x) {\n    return x * x;\n}","front":"","source":"L6_Functions.pdf · 7–8","headers":"","scope":"global"},{"id":"functions-05","topic":"functions","kind":"term","q":{"bg":"Предаване по стойност","en":"Pass by value"},"a":{"bg":"Параметърът е отделно копие. Присвояване на параметъра не променя оригиналната променлива при извикващия.","en":"The parameter is a separate copy. Assigning to it does not change the caller’s original variable."},"code":"void change(int x) {\n    x = 99;\n}","front":"","source":"L6_Functions.pdf · 3, 5","headers":"","scope":"global"},{"id":"functions-06","topic":"functions","kind":"term","q":{"bg":"Предаване чрез псевдоним (референция)","en":"Pass by reference"},"a":{"bg":"Параметър с & е псевдоним на подадения обект. Промяната му променя оригинала.","en":"A parameter with & aliases the supplied object. Changing it changes the original."},"code":"void change(int& x) {\n    x = 99;\n}","front":"","source":"L6_Functions.pdf · 4–5","headers":"","scope":"global"},{"id":"functions-07","topic":"functions","kind":"how","q":{"bg":"Как да разменим две променливи чрез функция?","en":"How do we swap two variables using a function?"},"a":{"bg":"Параметрите трябва да позволяват промяна на оригиналите. Тук са референции; временната променлива пази първата стойност.","en":"The parameters must allow changes to the originals. Here they are references; a temporary preserves the first value."},"code":"void swapValues(int& a, int& b) {\n    int temp = a;\n    a = b;\n    b = temp;\n}","front":"","source":"L6_Functions.pdf · 11","headers":"","scope":"global"},{"id":"functions-08","topic":"functions","kind":"how","q":{"bg":"Как да върнем два резултата?","en":"How do we return two results?"},"a":{"bg":"В този курс може да използваме изходни параметри-референции. return сам по себе си връща една стойност.","en":"In this course, use reference output parameters. A return statement itself returns one value."},"code":"void sumProduct(double a, double b,\n                double& sum, double& product) {\n    sum = a + b;\n    product = a * b;\n}","front":"","source":"L6_Functions.pdf · 4","headers":"","scope":"global"},{"id":"functions-09","topic":"functions","kind":"term","q":{"bg":"Указател като параметър","en":"Pointer parameter"},"a":{"bg":"Адресът се предава като стойност, но чрез *p функцията може да промени сочения обект. Указателят трябва да сочи към валиден обект.","en":"The address is passed by value, but the function can modify the pointed-to object through *p. The pointer must point to a valid object."},"code":"void setZero(int* p) {\n    *p = 0;\n}","front":"","source":"L6_Functions.pdf · 14–15","headers":"","scope":"global"},{"id":"functions-10","topic":"functions","kind":"how","q":{"bg":"Как да предадем масив на функция?","en":"How do we pass an array to a function?"},"a":{"bg":"Параметърът a[] се преобразува в указател. Предай отделно броя елементи. const показва, че функцията не ги променя чрез a.","en":"The a[] parameter is adjusted to a pointer. Pass the element count separately. const prevents changes through a."},"code":"int sumArray(const int a[], int n) {\n    int sum = 0;\n    for (int i = 0; i < n; ++i) sum += a[i];\n    return sum;\n}","front":"","source":"L6_Functions.pdf · 16–17","headers":"","scope":"global"},{"id":"functions-11","topic":"functions","kind":"read","q":{"bg":"Защо sizeof(a) не дава дължината на параметър a[]?","en":"Why doesn’t sizeof(a) give the length of an a[] parameter?"},"a":{"bg":"В параметър a[] е указател, затова sizeof(a) е размер на указател. Подай n отделно. В истински локален масив sizeof(a)/sizeof(a[0]) дава броя елементи.","en":"In a parameter, a[] is a pointer, so sizeof(a) gives the pointer size. Pass n separately. For an actual local array, sizeof(a)/sizeof(a[0]) gives its element count."},"code":"","front":"","source":"L6_Functions.pdf · 16","headers":"","scope":"block"},{"id":"functions-12","topic":"functions","kind":"term","q":{"bg":"Локална променлива","en":"Local variable"},"a":{"bg":"Дефинирана в блок или функция и видима в своя обхват. Обикновената автоматична локална променлива има живот до края на блока.","en":"Defined in a block or function and visible within its scope. An ordinary automatic local variable lives until the block ends."},"code":"","front":"","source":"L6_Functions.pdf · 5–6, 23–24","headers":"","scope":"block"},{"id":"functions-13","topic":"functions","kind":"term","q":{"bg":"Глобална променлива","en":"Global variable"},"a":{"bg":"Дефинирана извън функциите. Може да се използва от функциите, в чийто обхват е видима. Споделеното състояние прави зависимостите по-трудни за проследяване.","en":"Defined outside functions. Functions can use it where it is visible. Shared state makes dependencies harder to trace."},"code":"","front":"","source":"L6_Functions.pdf · 23–24","headers":"","scope":"block"},{"id":"functions-14","topic":"functions","kind":"term","q":{"bg":"static локална променлива","en":"Static local variable"},"a":{"bg":"Запазва стойността си между извикванията и се инициализира веднъж. Името остава локално.","en":"Retains its value between calls and is initialized once. Its name remains local."},"code":"int nextNumber() {\n    static int count = 0;\n    return ++count;\n}","front":"","source":"L6_Functions.pdf · 28","headers":"","scope":"global"},{"id":"functions-15","topic":"functions","kind":"term","q":{"bg":"Аргумент по подразбиране","en":"Default argument"},"a":{"bg":"Използва се, когато при извикване е пропуснат съответният аргумент. Обикновено задавай подразбиранията в декларацията, без повторно задаване.","en":"Used when the corresponding argument is omitted in a call. Usually specify defaults in the declaration, without repeating them."},"code":"int add(int a, int b = 1) {\n    return a + b;\n}","front":"","source":"L6_Functions.pdf · 25","headers":"","scope":"global"},{"id":"functions-16","topic":"functions","kind":"term","q":{"bg":"Предефиниране (overloading)","en":"Function overloading"},"a":{"bg":"Едно име за функции с различни списъци параметри. Само различен тип на резултата не е достатъчен.","en":"One name for functions with different parameter lists. A different return type alone is insufficient."},"code":"int twice(int x) { return 2 * x; }\ndouble twice(double x) { return 2 * x; }","front":"","source":"L6_Functions.pdf · 26–27","headers":"","scope":"global"},{"id":"functions-17","topic":"functions","kind":"term","q":{"bg":"inline","en":"inline"},"a":{"bg":"В лекцията е представен като предложение за вграждане. Не гарантира, че компилаторът ще замени извикването с тялото.","en":"The lecture presents it as a suggestion for inlining. It does not guarantee that the compiler replaces a call with the body."},"code":"inline int square(int x) { return x * x; }","front":"","source":"L6_Functions.pdf · 27–28","headers":"","scope":"global"},{"id":"functions-18","topic":"functions","kind":"read","q":{"bg":"Може ли функция да върне адрес на своя локална променлива?","en":"May a function return the address of its local variable?"},"a":{"bg":"Не го използвай: обикновената локална променлива вече не съществува след връщане. Върни стойност или адрес към обект с достатъчно дълъг живот.","en":"Do not use it: an ordinary local variable no longer exists after return. Return a value or a pointer to an object with sufficient lifetime."},"code":"","front":"","source":"L6_Functions.pdf · 29–30","headers":"","scope":"block"},{"id":"functions-19","topic":"functions","kind":"how","q":{"bg":"Как се предава функция като аргумент?","en":"How do we pass a function as an argument?"},"a":{"bg":"Чрез указател към функция със съвместим тип. Позволява един алгоритъм да използва различни изчисления.","en":"Use a pointer to a function with a matching type. One algorithm can then use different calculations."},"code":"double square(double x) { return x * x; }\ndouble apply(double (*f)(double), double x) {\n    return f(x);\n}","front":"","source":"L6_Functions.pdf · 33–35","headers":"","scope":"global"},{"id":"functions-20","topic":"functions","kind":"how","q":{"bg":"Как да подадем двумерен масив на функция?","en":"How do we pass a two-dimensional array to a function?"},"a":{"bg":"В този вариант броят стълбове е част от типа и трябва да е известен. Броят редове се предава отделно.","en":"In this form, the column count is part of the type and must be known. Pass the row count separately."},"code":"int sumMatrix(const int a[][3], int rows) {\n    int sum = 0;\n    for (int i = 0; i < rows; ++i)\n        for (int j = 0; j < 3; ++j) sum += a[i][j];\n    return sum;\n}","front":"","source":"L6_Functions.pdf · 18–19","headers":"","scope":"global"},{"id":"strings-01","topic":"strings","kind":"term","q":{"bg":"C символен низ","en":"C string"},"a":{"bg":"Масив от char, завършващ с \\0. Капацитетът трябва да включва място за крайния символ.","en":"A char array terminated by \\0. Its capacity must include room for the terminator."},"code":"char name[31] = \"Ana\";","front":"","source":"L7_Strings.pdf · 1","headers":"","scope":"block"},{"id":"strings-02","topic":"strings","kind":"read","q":{"bg":"Колко памет за \"cat\"?","en":"How much storage does \"cat\" need?"},"a":{"bg":"4 char елемента: c, a, t и \\0. strlen е 3, а sizeof на този масив е 4.","en":"4 char elements: c, a, t and \\0. strlen is 3, while sizeof this array is 4."},"code":"char s[] = \"cat\";","front":"","source":"L7_Strings.pdf · 1","headers":"","scope":"block"},{"id":"strings-03","topic":"strings","kind":"how","q":{"bg":"Как да прочетем ред с интервали?","en":"How do we read a line containing spaces?"},"a":{"bg":"cin.getline(s, capacity) чете най-много capacity-1 символа, добавя \\0 и извлича разделителя за нов ред. Прекалено дълъг ред задава failbit.","en":"cin.getline(s, capacity) reads at most capacity-1 characters, adds \\0 and extracts the newline delimiter. An overlong line sets failbit."},"code":"char line[81];\nstd::cin.getline(line, sizeof line);","front":"","source":"L7_Strings.pdf · 2","headers":"iostream","scope":"block"},{"id":"strings-04","topic":"strings","kind":"how","q":{"bg":"Как да въведем една дума с ограничена дължина?","en":"How do we read one word with a length limit?"},"a":{"bg":">> пропуска водещите празни символи и спира пред следващ празен символ. За C++17 setw ограничава записването в char масива.","en":">> skips leading whitespace and stops before the next whitespace. For C++17, setw limits writes into the char array."},"code":"char word[21];\nstd::cin >> std::setw(21) >> word;","front":"","source":"L7_Strings.pdf · 2","headers":"iostream,iomanip","scope":"block"},{"id":"strings-05","topic":"strings","kind
